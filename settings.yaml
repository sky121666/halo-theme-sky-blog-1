                                  value: effect-particles
                                  options:
                                    - label: 无
                                      value: none
                                    - label: 粒子轨道
                                      value: effect-particles
                                    - label: 星光闪烁
                                      value: effect-starlight
                              __raw__sectionsSchema:
                                outer:
                                  attrs:
                                    hidden: $get(sky_home_section).value !== 'hero'
                    - $el: details
                      attrs:
                        class: sky-settings-details
                        hidden: $get(sky_home_section).value !== 'hero'
                      children:
