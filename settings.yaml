                  label: 自定义颜色（浅色主题）
                  value: "#000000"
                - $formkit: radio
                  outer-class: sky-setting-segments sky-settings-swatches
                  __raw__sectionsSchema: *sky_settings_swatch_label
                  preserve: true
                  id: dark_scheme
                  name: dark_scheme
                  key: index_background_settings_dark_scheme_field
                  if: $get(index_enable_header).value && $get(index_header_background_type).value === 'image'
                  label: 深色主题蒙版
                  value: black
                  options:
                    - label: 黑色
                      value: black
                      attrs: {dataColor: "#1a1a1a"}
                    - label: 白色
                      value: white
                      attrs: {dataColor: "#ffffff"}
                    - label: 主题背景色
                      value: theme
                      attrs: {dataColor: "#374151"}
                    - label: 自定义
                      value: custom
                      attrs: {dataColor: "#6366f1"}
                - $formkit: color
                  preserve: true
                  name: dark_custom_color
                  key: index_background_settings_dark_custom_color_field
