apiVersion: v1alpha1
kind: Setting
metadata:
  name: theme-sky-blog-1-setting
spec:
  forms:
    - group: general
      label: 基础
      formSchema:
        - $el: style
          attrs: {hidden: true}
          children: &sky_settings_segments_css |
            .sky-setting-segments > .formkit-fieldset {
              min-width: 0;
              max-width: none;
              padding: 0;
              border: 0;
            }
            .sky-setting-segments .formkit-legend { padding: 0; }
            .sky-setting-segments .formkit-help { margin: 8px 0 0; padding: 0; }
            .sky-setting-segments .formkit-options {
              display: flex;
              flex-wrap: wrap;
              gap: 8px;
              margin: 8px 0 0;
            }
            .sky-setting-segments .formkit-wrapper {
              position: relative;
              display: flex;
              align-items: center;
              min-height: 36px;
              margin: 0;
              padding: 4px 12px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
            }
            .sky-setting-segments .formkit-input {
              position: absolute;
              width: 1px;
              height: 1px;
              margin: 0;
              clip-path: inset(50%);
            }
            .sky-setting-segments .formkit-wrapper:hover { border-color: #6b7280; }
            .sky-setting-segments .formkit-wrapper:has(input:checked) {
              border-color: #4ccba0;
              background: #ebf9f3;
              color: #146846;
            }
            .sky-setting-segments .formkit-wrapper:has(input:focus-visible) {
              outline: 2px solid #2563eb;
              outline-offset: 2px;
            }
            .sky-settings-note {
              max-width: 32rem;
              margin: 0;
              padding: 8px 0;
              color: #4b5563;
              font-size: 13px;
              line-height: 1.5;
            }
            .sky-settings-group > legend + .sky-settings-note { padding-block-start: 0; }
            form:is(#general, #visual, #components, #pages, #plugins, [id^="array-item-form-"]) .formkit-fieldset {
              min-inline-size: 0;
            }
            .sky-settings-subnav .formkit-wrapper {
              min-height: 34px;
              padding-inline: 8px;
            }
            @media (max-width: 767px) {
              form:is(#general, #visual, #components, #pages, #plugins) + .sticky-element {
                bottom: calc(52px + env(safe-area-inset-bottom, 0px));
                z-index: 1;
              }
            }
            @media (max-width: 390px) {
              .sky-settings-subnav .formkit-options { gap: 4px; }
              .sky-settings-subnav .formkit-wrapper { padding-inline: 6px; }
            }
            .sky-settings-details {
              max-width: 32rem;
              margin-block: 8px;
            }
            .sky-settings-details > summary,
            .sky-settings-disclosure {
              display: flex;
              align-items: center;
              justify-content: space-between;
              gap: 8px;
              min-height: 40px;
              margin: 0;
              padding: 8px 12px;
              border: 1px solid #dfe3e8;
              border-radius: 6px;
              background: #f8fafc;
              cursor: pointer;
              font-size: 14px;
              font-weight: 500;
            }
            .sky-settings-disclosure {
              width: 100%;
              max-width: 32rem;
              margin-block: 8px;
              text-align: start;
            }
            .sky-settings-details > summary {
              list-style: none;
              overflow-wrap: anywhere;
            }
            .sky-settings-details > summary::-webkit-details-marker { display: none; }
            .sky-settings-details > summary::after,
            .sky-settings-disclosure::after {
              content: "";
              flex: none;
              width: 7px;
              height: 7px;
              margin: 0 3px 3px 0;
              border-right: 1.5px solid #4b5563;
              border-bottom: 1.5px solid #4b5563;
              transform: rotate(45deg);
            }
            .sky-settings-details[open] > summary::after,
            .sky-settings-disclosure[aria-expanded="true"]::after {
              margin-bottom: -3px;
              transform: rotate(225deg);
            }
            .sky-settings-details > summary:hover,
            .sky-settings-disclosure:hover { border-color: #9ca3af; }
            .sky-settings-details > summary:focus-visible,
            .sky-settings-disclosure:focus-visible {
              outline: 2px solid #2563eb;
              outline-offset: 2px;
            }
            .sky-settings-swatches .formkit-label {
              display: flex;
              align-items: center;
              gap: 6px;
            }
            .sky-settings-swatch {
              width: 14px;
              height: 14px;
              border: 1px solid #9ca3af;
              border-radius: 50%;
            }
            .sky-settings-preview > fieldset { min-width: 0; }
            .sky-settings-preview .formkit-options {
              display: grid;
              grid-template-columns: repeat(auto-fill, minmax(92px, 1fr));
              gap: 8px;
              max-width: 32rem;
              padding: 3px;
            }
            .sky-settings-preview .formkit-wrapper {
              position: relative;
              display: flex;
              height: 100%;
              min-width: 0;
              margin: 0;
              padding: 6px;
              border: 1px solid #d1d5db;
              border-radius: 6px;
            }
            .sky-settings-preview .formkit-inner {
              position: absolute;
              inset: 0;
            }
            .sky-settings-preview input[type="radio"] {
              width: 100%;
              height: 100%;
              margin: 0;
              opacity: 0;
              cursor: pointer;
            }
            .sky-settings-preview .formkit-label {
              display: grid;
              width: 100%;
              gap: 5px;
              align-content: start;
              font-size: 12px;
              line-height: 1.3;
              text-align: center;
            }
            .sky-settings-preview img {
              display: block;
              width: 100%;
              height: 46px;
              border-radius: 3px;
              object-fit: contain;
            }
            form#pages .sky-login-panel > fieldset,
            form#pages .sky-login-previews > fieldset { padding: 0; border: 0; }
            form#pages .sky-login-panel > fieldset > legend { display: none; }
            form#pages .sky-login-previews .formkit-options {
              grid-template-columns: repeat(auto-fit, minmax(104px, 1fr));
            }
            form#pages .sky-login-previews img { height: 72px; }
            .sky-settings-preview .formkit-wrapper:hover { border-color: #6b7280; }
            .sky-settings-preview .formkit-wrapper:has(input:checked) {
              border-color: #4ccba0;
              background: #ebf9f3;
            }
            .sky-settings-preview .formkit-wrapper:has(input:focus-visible) {
              outline: 2px solid #2563eb;
              outline-offset: 1px;
            }
        - $formkit: radio
          id: sky_general_section
          label: 基础设置
          outer-class: sky-setting-segments sky-settings-subnav
          legend-class: "$reset sr-only"
          ignore: true
          value: profile
          options:
            - {label: 作者资料, value: profile}
            - {label: GitHub, value: github}
            - {label: 高级, value: maintenance}
        - $formkit: group
          name: profile
          label: 作者资料
          value:
            avatar: ""
            nickname: "Sky"
            role: "全栈开发者 & 开源爱好者"
            bio: "热爱编程，专注于 Web 全栈开发。喜欢探索新技术，乐于分享经验。在这里记录技术笔记、生活感悟，希望能帮助到更多人。"
          children:
            - $el: p
              attrs:
                class: sky-settings-note
              children: 昵称与简介用于关于页和访客侧栏。
            - $formkit: attachment
              name: avatar
              label: 作者头像
              help: 用于访客侧边栏的作者卡片和关于页。
              accepts:
                - image/jpeg
                - image/png
                - image/webp
            - $el: div
              attrs:
                class: sky-settings-field-row
              children:
                - $formkit: text
                  name: nickname
                  label: 昵称
                  __raw__outer-class: &sky_settings_paired_field "$remove:py-4 $remove:first:pt-0 $remove:last:pb-0 sky-settings-paired-field"
                  placeholder: "留空则使用站点名称"
                - $formkit: text
                  name: role
                  label: 关于页职位
                  __raw__outer-class: *sky_settings_paired_field
                  placeholder: "如：全栈开发者"
            - $formkit: textarea
              name: bio
              label: 个人简介
              help: 支持 HTML 标签
              rows: 3
              placeholder: "简单介绍一下自己..."
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_general_section).value !== 'profile'
        - $formkit: group
          name: github
          label: GitHub
          value:
            username: sky121666
            stats_host: https://github-readme-stats.xoku.cn
            locale: ''
            stats_theme: ''
          children:
            - $el: p
              attrs:
                class: sky-settings-note
              children: 账号用于首页贡献热力图和关于页 GitHub 卡片。
            - $formkit: text
              id: about_github_username
              name: username
              label: GitHub 用户名
              placeholder: "如：sky121666"
            - $el: details
              attrs:
                class: sky-settings-details
                hidden: $get(about_github_username).value == null || $get(about_github_username).value === ""
              children:
                - $el: summary
                  children: 统计服务、语言与主题
                - $el: div
                  attrs: {class: pt-2}
                  children:
                    - $formkit: url
                      preserve: true
                      name: stats_host
                      key: about_settings_github_stats_host_field
                      label: GitHub Stats 服务地址
                      if: $get(about_github_username).value
                      help: 用于关于页的统计卡片，可填写自建服务地址。
                      value: "https://github-readme-stats.xoku.cn"
                      placeholder: "https://github-readme-stats.xoku.cn"
                    - $formkit: select
                      preserve: true
                      name: locale
                      searchable: true
                      key: about_settings_github_locale_field
                      label: 语言（可选）
                      if: $get(about_github_username).value
                      options:
                        - label: 默认（英文）
                          value: ""
                        - label: 简体中文
                          value: cn
                        - label: 繁体中文
                          value: zh-tw
                        - label: 日语
                          value: ja
                        - label: 韩语
                          value: ko
                        - label: 德语
                          value: de
                        - label: 法语
                          value: fr
                        - label: 西班牙语
                          value: es
                        - label: 俄语
                          value: ru
                        - label: 葡萄牙语（巴西）
                          value: pt-br
                    - $formkit: select
                      preserve: true
                      name: stats_theme
                      searchable: true
                      key: about_settings_github_stats_theme_field
                      label: 主题（可选）
                      if: $get(about_github_username).value
                      help: 留空使用自动适配主题
                      options:
                        - label: 自动适配（推荐）
                          value: ""
                        - label: 默认
                          value: default
                        - label: 透明
                          value: transparent
                        - label: Dark
                          value: dark
                        - label: Radical
                          value: radical
                        - label: Merko
                          value: merko
                        - label: Gruvbox
                          value: gruvbox
                        - label: Tokyonight
                          value: tokyonight
                        - label: Onedark
                          value: onedark
                        - label: Cobalt
                          value: cobalt
                        - label: Synthwave
                          value: synthwave
                        - label: Dracula
                          value: dracula
                        - label: Nord
                          value: nord
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_general_section).value !== 'github'
        - $formkit: group
          label: SEO
          name: seo_settings
          value:
            theme_canonical: false
          children:
            - $formkit: switch
              name: theme_canonical
              label: 由主题输出 canonical
              help: 仅用于主题页面。启用前请关闭 SEO 工具集的规范链接。
              value: false
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_general_section).value !== 'maintenance'

        - $formkit: group
          label: 调试
          name: debug_settings
          value:
            enable_developer_mode: false
            enable_weather_debug: false
          children:
            - $formkit: switch
              name: enable_developer_mode
              id: general_developer_mode
              label: 开发者模式
              help: 在浏览器控制台记录导航与插件生命周期。
              value: false
            - $formkit: switch
              name: enable_weather_debug
              key: general_weather_debug_field
              if: $get(general_developer_mode).value
              preserve: true
              label: 天气调试日志
              value: false
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_general_section).value !== 'maintenance'

    - group: visual
      label: 视觉系统
      formSchema:
        - $el: style
          attrs: {hidden: true}
          children: *sky_settings_segments_css
        - $el: style
          attrs: {hidden: true}
          children: |
            .sky-glow-fields:not([hidden]) {
              display: grid;
              align-items: start;
              gap: 0 12px;
              min-width: 0;
            }
            .sky-glow-fields .sky-glow-number-wrapper { gap: 8px; }
            .sky-glow-colors { grid-template-columns: repeat(2, minmax(0, 1fr)); }
            .sky-glow-numbers { grid-template-columns: repeat(auto-fit, minmax(105px, 1fr)); }
            .sky-glow-fields .sky-glow-options { gap: 6px; }
            .sky-glow-fields .sky-glow-choice { padding-inline: 8px; }
            .sky-glow-advanced-content { padding: 4px 0 8px; }
            .sky-glow-picker-search {
              display: grid;
              grid-template-columns: auto minmax(0, 1fr);
              align-items: center;
              gap: 8px;
            }
            @media (min-width: 640px) {
              .sky-glow-basics { grid-template-columns: minmax(0, 1fr) 104px; }
            }
        - $el: p
          attrs:
            class: mb-3 max-w-lg text-sm text-gray-600
          children: 全站配色、背景、字体与光晕。
        - $formkit: radio
          outer-class: sky-setting-segments
          legend-class: "$reset sr-only"
          label: 视觉设置
          value: palette
          options:
            - {label: 主题配色, value: palette}
            - {label: 背景与字体, value: look}
            - {label: 光晕, value: glow}
          ignore: true
          id: sky_visual_section
        - $cmp: SkyBlogSettingsFeedback
        - $formkit: group
          name: theme_settings
          label: 主题配色
          value:
            default_theme: auto
            light_theme: light
            dark_theme: dark
          children:
            - $formkit: radio
              id: sky_palette_default_mode
              outer-class: sky-setting-segments
              help: 顶部主题切换开启时，优先使用访客的手动选择。
              name: default_theme
              label: 访客默认模式
              value: auto
              options:
                - label: 浅色主题
                  value: light_theme
                - label: 深色主题
                  value: dark_theme
                - label: 跟随系统
                  value: auto
            - $el: details
              attrs: {class: "sky-settings-details sky-settings-palette-editor"}
              children:
                - $el: summary
                  children:
                    - $el: span
                      attrs: {class: sky-settings-palette-heading}
                      children:
                        - $el: span
                          children: 更换配色
                        - $el: span
                          attrs: {class: sky-settings-palette-current}
                          children:
                            - $el: span
                              attrs: {data-palette: $get(sky_palette_light).value}
                              children: '$: "浅色 " + ($get(sky_palette_light).value || "light")'
                            - $el: span
                              children: '$: "深色 " + ($get(sky_palette_dark).value || "dark")'
                - $el: div
                  attrs: {class: sky-settings-palette-body}
                  children:
                    - $formkit: radio
                      id: sky_palette_preview_mode
                      label: 编辑配色
                      # 样式类复用标量锚点，避免占用 Halo 的集合别名额度。
                      __raw__outer-class: &sky_settings_choice_outer_class "$remove:py-4 $remove:first:pt-0 $remove:last:pb-0 sky-setting-segments sky-settings-choice-row"
                      fieldset-class: &sky_settings_choice_fieldset_class "$reset sky-settings-choice-layout"
                      __raw__legend-class: &sky_settings_choice_legend_class "$remove:px-2 sky-settings-choice-label"
                      options-class: &sky_settings_choice_options_class sky-settings-choice-options
                      ignore: true
                      value: light
                      options:
                        - {label: 浅色, value: light}
                        - {label: 深色, value: dark}
                    - $el: div
                      attrs:
                        class: sky-settings-palette
                        hidden: $get(sky_palette_preview_mode).value !== 'light'
                      children:
                        - $formkit: radio
                          id: sky_palette_light
                          __raw__outer-class: &sky_settings_palette_outer_class "$remove:py-4 $remove:first:pt-0 $remove:last:pb-0 sky-settings-preview"
                          fieldset-class: &sky_settings_preview_fieldset_class "$reset sky-settings-preview-layout"
                          legend-class: "$reset sr-only"
                          options-class: &sky_settings_palette_options_class sky-settings-palette-options
                          __raw__sectionsSchema: &sky_settings_preview_label
                            label:
                              children:
                                - $el: img
                                  attrs:
                                    src: $option.attrs.dataPreview
                                    alt: ""
                                    loading: lazy
                                - $el: span
                                  children: $option.label
                          name: light_theme
                          label: 浅色色板
                          value: light
                          options:
                            - label: Light
                              value: light
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/light.svg}
                            - label: Cupcake
                              value: cupcake
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/cupcake.svg}
                            - label: Bumblebee
                              value: bumblebee
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/bumblebee.svg}
                            - label: Emerald
                              value: emerald
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/emerald.svg}
                            - label: Corporate
                              value: corporate
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/corporate.svg}
                            - label: Retro
                              value: retro
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/retro.svg}
                            - label: Cyberpunk
                              value: cyberpunk
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/cyberpunk.svg}
                            - label: Valentine
                              value: valentine
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/valentine.svg}
                            - label: Garden
                              value: garden
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/garden.svg}
                            - label: Lofi
                              value: lofi
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/lofi.svg}
                            - label: Pastel
                              value: pastel
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/pastel.svg}
                            - label: Fantasy
                              value: fantasy
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/fantasy.svg}
                            - label: Wireframe
                              value: wireframe
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/wireframe.svg}
                            - label: CMYK
                              value: cmyk
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/cmyk.svg}
                            - label: Autumn
                              value: autumn
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/autumn.svg}
                            - label: Acid
                              value: acid
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/acid.svg}
                            - label: Lemonade
                              value: lemonade
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/lemonade.svg}
                            - label: Winter
                              value: winter
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/winter.svg}
                            - label: Nord
                              value: nord
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/nord.svg}
                            - label: Caramellatte
                              value: caramellatte
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/caramellatte.svg}
                            - label: Silk
                              value: silk
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/silk.svg}
                    - $el: div
                      attrs:
                        class: sky-settings-palette
                        hidden: $get(sky_palette_preview_mode).value !== 'dark'
                      children:
                        - $formkit: radio
                          id: sky_palette_dark
                          __raw__outer-class: *sky_settings_palette_outer_class
                          fieldset-class: *sky_settings_preview_fieldset_class
                          legend-class: "$reset sr-only"
                          options-class: *sky_settings_palette_options_class
                          __raw__sectionsSchema: *sky_settings_preview_label
                          name: dark_theme
                          label: 深色色板
                          value: dark
                          options:
                            - label: Dark
                              value: dark
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/dark.svg}
                            - label: Synthwave
                              value: synthwave
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/synthwave.svg}
                            - label: Halloween
                              value: halloween
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/halloween.svg}
                            - label: Forest
                              value: forest
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/forest.svg}
                            - label: Aqua
                              value: aqua
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/aqua.svg}
                            - label: Black
                              value: black
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/black.svg}
                            - label: Luxury
                              value: luxury
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/luxury.svg}
                            - label: Dracula
                              value: dracula
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/dracula.svg}
                            - label: Business
                              value: business
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/business.svg}
                            - label: Night
                              value: night
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/night.svg}
                            - label: Coffee
                              value: coffee
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/coffee.svg}
                            - label: Dim
                              value: dim
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/dim.svg}
                            - label: Sunset
                              value: sunset
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/sunset.svg}
                            - label: Abyss
                              value: abyss
                              attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/abyss.svg}
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_visual_section).value != 'palette'
        - $formkit: group
          name: global_background
          label: 全局背景
          value:
            enable_custom: false
            background_style: base-200
          children:
            - $formkit: switch
              id: enable_custom_bg
              name: enable_custom
              label: 启用自定义背景
              value: false
            - $formkit: radio
              outer-class: sky-setting-segments
              preserve: true
              help: 底色随主题配色变化。
