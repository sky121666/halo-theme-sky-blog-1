              enable_comment: true
            display_settings:
              show_link_status: true
              show_link_feeds: true
            apply_settings:
              enable: true
              apply_title: 想要交换友链？
              apply_description: 如果你也有一个优质的网站或博客，欢迎与我交换友链。请确保你的网站内容健康、定期更新，并已添加本站链接。
