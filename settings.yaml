                    - label: 白色
                      value: white
                      attrs: {dataColor: "#ffffff"}
                    - label: 主题背景色
                      value: theme
                      attrs: {dataColor: "#e5e7eb"}
                    - label: 自定义
                      value: custom
                      attrs: {dataColor: "#6366f1"}
                - $formkit: color
                  preserve: true
                  name: light_custom_color
                  key: index_background_settings_light_custom_color_field
