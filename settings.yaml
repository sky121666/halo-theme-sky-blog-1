                          label: 站点 Logo
                          placeholder: "https://example.com/logo.png"
                        - $formkit: text
                          preserve: true
                          name: blogger_title
                          key: links_settings_apply_settings_blogger_title_field
                          if: $get(apply_enable).value
                          label: 站点名称
                          placeholder: "My Blog"
                        - $formkit: text
                          preserve: true
                          name: blogger_rss
                          key: links_settings_apply_settings_blogger_rss_field
                          if: $get(apply_enable).value
                          label: RSS 地址
                          placeholder: "https://example.com/rss.xml"
                        - $formkit: email
                          preserve: true
                          name: blogger_email
                          key: links_settings_apply_settings_blogger_email_field
