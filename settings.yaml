                  value: starry-sky
                  options:
                    - label: 流体渐变
                      value: fluid-gradient
                    - label: 霓虹线条
                      value: neon-lines
                    - label: 深邃星空
                      value: starry-sky
            # 蒙版渐变设置 - 扁平化到 background_settings 中
                - $formkit: radio
