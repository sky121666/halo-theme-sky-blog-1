                                  help: 支持 HEX 和 CSS 变量。
                                  placeholder: "var(--color-primary)"
                                  value: "var(--color-primary)"
                                - $formkit: radio
                                  outer-class: sky-setting-segments
                                  preserve: true
                                  id: decoration_effect
                                  name: decoration_effect
                                  key: index_title_settings_decoration_effect_field
