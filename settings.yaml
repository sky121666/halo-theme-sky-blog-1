                                  help: 支持 HEX 和 CSS 变量。
                                  placeholder: "var(--color-primary)"
                                  value: ""
                              __raw__sectionsSchema:
                                outer:
                                  attrs:
                                    hidden: $get(sky_home_section).value !== 'hero'
                    - $el: details
