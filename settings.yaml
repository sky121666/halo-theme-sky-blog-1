                                  label: 字体
                                  value: font-default
                                  options:
                                    - label: 默认字体
                                      value: font-default
                                    - label: Monoton
                                      value: font-monoton
                                    - label: Titan One
                                      value: font-titan-one
                                    - label: 霞鹜文楷亮
                                      value: font-lxgw-wenkai-bright
                                    - label: 思源宋
                                      value: font-siyuan-songti
                                - $formkit: radio
                                  outer-class: sky-setting-segments
                                  preserve: true
                                  name: subtitle_effect
                                  id: subtitle_effect
                                  key: subtitle_effect_field
                                  if: $get(show_subtitle).value
                                  label: 副标题效果
                                  value: typewriter
                                  options:
                                    - value: none
                                      label: 无
                                    - value: typewriter
                                      label: 打字机
                                    - value: gradient-flow
                                      label: 渐变流动
                                    - value: subtle-glow
                                      label: 微光
                                    - value: fade-pulse
                                      label: 呼吸
                                - $formkit: text
                                  preserve: true
                                  name: subtitle_color
