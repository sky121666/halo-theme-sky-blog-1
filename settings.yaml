    - group: plugins
      label: 插件
      formSchema:
        - $el: style
          attrs: {hidden: true}
          children: *sky_settings_segments_css
        - $formkit: radio
          id: sky_plugin_settings_section
          label: 插件设置
          outer-class: sky-setting-segments sky-settings-subnav
          legend-class: "$reset sr-only"
          ignore: true
          value: editor
          options:
            - {label: 插件配置, value: editor}
            - {label: 设置入口管理, value: visibility}
        - $cmp: SkyBlogSettingsFeedback
        - $formkit: list
          id: sky_plugin_available_options
          ignore: true
          __raw__sectionsSchema: *sky_hidden_option_list
          children:
            - $formkit: hidden
              for:
                - plugin
                - index
                - - {label: 友链, value: links}
                  - {label: 图库, value: photos}
                  - {label: 瞬间, value: moments}
                  - {label: 文档, value: docsme}
                  - {label: 追番, value: bangumi}
                  - {label: 装备, value: equipment}
                  - {label: 网抑云, value: ncm}
              index: $index
              key: $plugin.value
              modelValue:
                if: '$get("sky_show_" + $plugin.value).value === false'
                then: []
                else: $plugin
        - $formkit: radio
          legend-class: "$reset sr-only"
          outer-class: sky-setting-segments sky-settings-subnav
          id: sky_plugin_section
