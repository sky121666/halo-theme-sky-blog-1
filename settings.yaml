              children:
                - $formkit: text
                  name: name
                  label: 技术名称
                  placeholder: "如：Vue.js"
                - $formkit: iconify
                  name: icon
                  label: 图标（可选）
                  format: svg
                  value-only: true
                - $formkit: range
                  name: proficiency
                  label: 熟练度（%）
                  value: 90
                  min: 0
                  max: 100
                  step: 5
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_about_section).value !== 'resources'
                    data-sky-settings-array: about_tech_stack
        # ========== Hero 按钮配置 ==========
            - $formkit: group
              name: hero_actions
              label: 页首操作
              value:
                show_primary: true
                primary_text: "查看作品"
                primary_link: "#sf-projects"
                show_secondary: true
                secondary_text: "联系我"
                secondary_link: ""
              children:
                - $formkit: group
                  name: primary_group
                  label: 主按钮
                  children:
                    - $formkit: switch
                      id: hero_show_primary
                      name: show_primary
                      label: 显示主按钮
                      value: true
                    - $formkit: text
                      preserve: true
                      name: primary_text
                      key: about_settings_hero_actions_primary_group_primary_text_field
                      label: 按钮文字
                      if: $get(hero_show_primary).value
                      value: "查看作品"
                      placeholder: "查看作品"
                    - $formkit: text
                      preserve: true
                      name: primary_link
                      key: about_settings_hero_actions_primary_group_primary_link_field
                      label: 按钮链接
                      if: $get(hero_show_primary).value
                      value: "#sf-projects"
                      placeholder: "#sf-projects"
                - $formkit: group
                  name: secondary_group
                  label: 次要按钮
                  children:
                    - $formkit: switch
                      id: hero_show_secondary
                      name: show_secondary
                      label: 显示次要按钮
                      value: true
                    - $formkit: text
                      preserve: true
                      name: secondary_text
                      key: about_settings_hero_actions_secondary_group_secondary_text_field
                      label: 按钮文字
                      if: $get(hero_show_secondary).value
                      value: "联系我"
                      placeholder: "联系我"
                    - $formkit: text
                      preserve: true
                      name: secondary_link
                      key: about_settings_hero_actions_secondary_group_secondary_link_field
                      label: 按钮链接
                      if: $get(hero_show_secondary).value
                      help: 留空则使用第一个社交链接
                      placeholder: "留空使用第一个社交链接"
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_about_section).value !== 'display'
        # ========== CTA 区域配置 ==========
            - $formkit: group
              name: cta
              label: 页尾行动区
              value:
                show_cta: true
                title: "让我们一起打造卓越的数字体验 — 立即开始您的下一个项目"
                button_text: "立即开始"
                button_link: "#sf-comments"
              children:
                - $formkit: switch
                  id: cta_show
                  name: show_cta
                  label: 显示页尾行动区
                  value: true
                - $formkit: textarea
                  preserve: true
                  name: title
                  key: about_settings_cta_title_field
                  label: 页尾标题
                  if: $get(cta_show).value
                  rows: 2
                  value: "让我们一起打造卓越的数字体验 — 立即开始您的下一个项目"
                - $formkit: text
                  preserve: true
                  name: button_text
                  key: about_settings_cta_button_text_field
                  label: 按钮文字
                  if: $get(cta_show).value
                  value: "立即开始"
                - $formkit: text
                  preserve: true
                  name: button_link
                  key: about_settings_cta_button_link_field
                  label: 按钮链接
                  if: $get(cta_show).value
                  value: "#sf-comments"
                  placeholder: "#sf-comments"
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_about_section).value !== 'display'
        # ========== 显示开关 ==========
            - $formkit: group
              name: display
              label: 内容与评论
              value:
                show_site_stats: true
                show_article_heatmap: true
                show_page_content: true
                enable_comment: true
              children:
                - $formkit: switch
                  name: show_site_stats
                  label: 显示站点统计
                  help: 显示文章数、分类数、评论数、访问量
                  value: true
                - $formkit: switch
                  name: show_article_heatmap
                  label: 显示文章发布热力图
                  help: 显示最近一年文章发布日期的热力图
                  value: true
                - $formkit: switch
                  name: show_page_content
                  label: 显示自定义内容
                  help: 显示单页面编辑器中的内容（使用文章样式渲染）
                  value: true
                - $formkit: switch
                  name: enable_comment
                  label: 启用评论
                  value: true
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_about_section).value !== 'display'
            - $formkit: group
              name: location
              label: 位置地图
              value:
                show_location: true
                tencent_map_key: ""
                latitude: 39.9042
                longitude: 116.4074
                location_name: "北京·中国"
                location_description: "在这座充满活力的城市中工作和生活"
              children:
                - $formkit: switch
                  id: about_show_location
                  name: show_location
                  label: 显示位置地图
                  help: 显示位置卡片和地图链接。
                  value: true
                - $formkit: text
                  preserve: true
                  name: tencent_map_key
                  key: about_settings_location_tencent_map_key_field
                  label: 腾讯地图公开 Key
                  if: $get(about_show_location).value
                  value: ""
                  help: 需要 WebService API。此值会公开，留空时使用位置卡片。
                - $el: div
                  attrs:
                    class: sky-settings-field-row
                    hidden: $get(about_show_location).value !== true
                  children:
                    - $formkit: number
                      preserve: true
                      name: latitude
                      key: about_settings_location_latitude_field
                      label: 纬度
                      __raw__outer-class: *sky_settings_paired_field
                      if: $get(about_show_location).value
                      placeholder: "39.9042"
                      step: 0.0001
                    - $formkit: number
                      preserve: true
                      name: longitude
                      key: about_settings_location_longitude_field
                      label: 经度
                      __raw__outer-class: *sky_settings_paired_field
                      if: $get(about_show_location).value
                      placeholder: "116.4074"
                      step: 0.0001
                - $formkit: text
                  preserve: true
                  name: location_name
                  key: about_settings_location_location_name_field
                  label: 位置名称
                  if: $get(about_show_location).value
                  placeholder: "如：北京·中国"
                - $formkit: textarea
                  preserve: true
                  name: location_description
                  key: about_settings_location_location_description_field
                  label: 位置描述
                  if: $get(about_show_location).value
                  rows: 2
                  placeholder: "简单描述一下这个位置..."
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_about_section).value !== 'location'
        # ========== 其他设置 ==========
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_page_section).value != 'about'
