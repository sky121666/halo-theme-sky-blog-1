                            options:
                              attrs:
                                style:
                                  overflowX: auto
                                  overscrollBehaviorX: contain
                                  scrollbarWidth: none
                                  paddingInline: 4px
                          value: 全部
                          options:
                            - {label: 全部, value: 全部, attrs: {id: visual_glow_category_all}}
                            - {label: 组件, value: 组件, attrs: {id: visual_glow_category_components}}
                            - {label: 首页, value: 首页, attrs: {id: visual_glow_category_home}}
                            - {label: 文章, value: 文章, attrs: {id: visual_glow_category_article}}
                            - {label: 插件, value: 插件, attrs: {id: visual_glow_category_plugins}}
                            - {label: 分组, value: 分组, attrs: {id: visual_glow_category_groups}}
                        # Keep catalog indexes stable and use an empty slot for configured targets.
                        - $formkit: list
                          id: visual_glow_pending
                          key: visual_glow_pending
                          ignore: true
                          __raw__sectionsSchema: &sky_hidden_option_list
                            outer:
                              $el: div
                              attrs: {hidden: true}
                              children: $slots.default
                          children:
                            - $formkit: hidden
                              for: [target, index, '$get(visual_glow_catalog).value']
                              index: $index
                              key: $target.value
                              modelValue:
                                if: >-
                                  $get("visual_glow_source_" + $target.value).value ||
                                   ($get(visual_glow_category).value !== "全部" && $get(visual_glow_category).value !== $target.category &&
                                   ($get(visual_glow_category).value !== "分组" || $target.isGroup !== true))
                                then: []
                                else:
                                  label: $target.label
                                  value: $target.value
                                  description: '$: $target.category + ($target.plugin && (" / " + $target.plugin) || "") + " · " + $target.keywords + " · " + $target.value'
                        - $formkit: select
                          name: id
                          # Remount the picker to clear the selection when switching categories.
                          key: '$: "visual_glow_target_selector_" + $get(visual_glow_category).value'
                          id: visual_glow_target_selector
                          label: 待添加对象
                          placeholder: 搜索名称、关键词或 ID
                          outer-class: "$reset min-w-0"
                          wrapper-class: "$reset sky-glow-picker-search"
                          label-class: "whitespace-nowrap"
                          inner-class: "min-w-0"
                          __raw__sectionsSchema:
                            inner:
                              attrs:
                                style: {maxWidth: none}
                          searchable: true
                          autoSelect: false
                          validation: required
                          options: '$get(visual_glow_pending).value.flat()'
                    - $formkit: hidden
                      name: id
                      if: &visual_glow_editing '$value.id && $get("visual_glow_source_" + $value.id).value'
                      key: visual_glow_saved_target
                    - $formkit: hidden
                      id: visual_glow_selected
                      if: $value
                      key: visual_glow_selected
                      ignore: true
                      modelValue: '$get("visual_glow_target_" + ($value.id || $get(visual_glow_target_selector).value)).value'
                    - $el: div
                      if: &visual_glow_has_target '$value && $get(visual_glow_selected).value'
                      key: visual_glow_component_heading
                      attrs: {class: "mb-4 space-y-1"}
                      children:
                        - if: *visual_glow_editing
                          then:
                            $el: h3
                            attrs: {class: "text-sm font-semibold text-gray-900"}
                            children: $get(visual_glow_selected).value.label
                        - $el: p
                          attrs: {class: "text-xs text-gray-500"}
                          children: $get(visual_glow_selected).value.scope
                    - $formkit: hidden
                      id: visual_glow_parent
                      if: *visual_glow_has_target
                      key: visual_glow_parent
                      ignore: true
                      modelValue:
                        if: '$get(visual_glow_selected).value.page && $get("visual_glow_source_" + $get(visual_glow_selected).value.page).value'
                        then: '$get("visual_glow_source_" + $get(visual_glow_selected).value.page).value'
                        else:
                          if: '$get(visual_glow_selected).value.owner && $get("visual_glow_source_" + $get(visual_glow_selected).value.owner).value'
                          then: '$get("visual_glow_source_" + $get(visual_glow_selected).value.owner).value'
                          else:
                            mode:
                              if: '$get(visual_glow_global_appearance).value.enabled === false'
                              then: "off"
                              else: custom
                            appearance:
                              if: '$get(visual_glow_selected).value.value === "post-page"'
                              then:
                                color_mode: $get(visual_glow_global_appearance).value.color_mode
                                strength: $get(visual_glow_global_appearance).value.strength
                                light_custom_color: $get(visual_glow_global_appearance).value.light_custom_color
                                dark_custom_color: $get(visual_glow_global_appearance).value.dark_custom_color
                                advanced_geometry: $get(visual_glow_global_appearance).value.advanced_geometry
                                geometry:
                                  offset: -1
                                  blur: '$get(visual_glow_global_appearance).value.geometry && $get(visual_glow_global_appearance).value.geometry.blur'
                                  spread: '$get(visual_glow_global_appearance).value.geometry && $get(visual_glow_global_appearance).value.geometry.spread'
                              else: $get(visual_glow_global_appearance).value
                            interaction: $get(visual_glow_global_interaction).value
                    # Halo resolves array labels from the child field rendered without an item.
                    - $formkit: nativeSelect
                      name: mode
                      if: '$value == undefined'
                      key: visual_glow_mode_label
                      options:
                        - {label: "· 自定义", value: "custom"}
                        - {label: "· 已关闭", value: "off"}
                    - $formkit: radio
                      name: mode
                      if: '$value && $get(visual_glow_selected).value && $get(visual_glow_parent).value'
                      key: visual_glow_mode
                      id: visual_glow_mode
                      label: 光晕设置
                      outer-class: sky-setting-segments
                      options:
                        - {label: 自定义, value: custom}
                        - {label: 关闭光晕, value: "off"}
                      value:
                        if: '$get(visual_glow_parent).value.mode === "off"'
                        then: "off"
                        else: custom
                    - $formkit: nativeGroup
                      name: appearance
                      if: '$value && $get(visual_glow_selected).value && $get(visual_glow_mode).value === "custom"'
                      key: visual_glow_component_appearance
                      preserve: true
                      value: $value.appearance || $get(visual_glow_parent).value.appearance || $get(visual_glow_global_appearance).value
                      children:
                        - $el: div
                          attrs: {class: "sky-glow-fields sky-glow-basics"}
                          children:
                            - $formkit: radio
                              __raw__outer-class: "$remove:py-4 $remove:first:pt-0 $remove:last:pb-0 sky-setting-segments sky-settings-paired-field"
                              id: visual_glow_component_color
                              name: color_mode
                              label: 光晕颜色
                              options-class: sky-glow-options
                              wrapper-class: sky-glow-choice
                              help: *visual_glow_color_help
                              value: neutral
                              options: *id003
                            - $formkit: number
                              name: strength
                              label: 基础强度（%）
                              __raw__outer-class: *sky_settings_paired_field
                              wrapper-class: sky-glow-number-wrapper
                              value: 100
                              min: 0
                              max: 200
                              step: 1
                              validation: required|number|between:0,200
                        - $el: div
                          key: visual_glow_component_palette
                          if: $get(visual_glow_component_color).value === 'custom'
                          attrs: {class: "sky-glow-fields sky-glow-colors"}
                          children: *visual_glow_palette_fields
                        - $formkit: hidden
                          id: sky_glow_component_advanced
                          ignore: true
                          value: false
                        - $cmp: SkyBlogSettingsDisclosure
                          props:
                            id: sky_glow_component_advanced_toggle
                            stateId: sky_glow_component_advanced
                            label: >-
                              交互反馈与形状
                            expanded: '$get(sky_glow_component_advanced).value === true'
                            aria-controls: "sky-glow-component-geometry sky-glow-component-feedback"
                        - $el: div
                          attrs:
                            id: sky-glow-component-geometry
                            class: sky-glow-advanced-content
                            hidden: $get(sky_glow_component_advanced).value !== true
                          children:
                            - $formkit: switch
                              id: visual_glow_component_shape
                              name: advanced_geometry
                              label: 自定义形状
                              value: false
                            - $formkit: nativeGroup
                              name: geometry
                              key: visual_glow_component_geometry
                              if: $get(visual_glow_component_shape).value
                              preserve: true
                              children: *id004
                    - $formkit: nativeGroup
                      name: interaction
                      if: '$value && $get(visual_glow_selected).value && $get(visual_glow_mode).value === "custom"'
                      key: visual_glow_component_interaction
                      preserve: true
                      value: $value.interaction || $get(visual_glow_parent).value.interaction || $get(visual_glow_global_interaction).value
                      children:
                        - $el: div
                          attrs:
                            id: sky-glow-component-feedback
                            hidden: $get(sky_glow_component_advanced).value !== true
                          children:
                            - $formkit: radio
                              id: visual_glow_component_states
                              name: state_profile
                              label: 反馈模式
                              outer-class: sky-setting-segments
                              value: standard
                              options: *id005
                            - $formkit: nativeGroup
                              name: states
                              key: visual_glow_component_state_values
                              if: $get(visual_glow_component_states).value === 'custom'
                              preserve: true
                              children: *id006
                  __raw__sectionsSchema:
                    outer:
                      attrs:
                        id: sky-glow-components-panel
                        data-sky-settings-array: visual_glow_components
        # Index the current draft so the picker excludes configured targets.
        - $formkit: hidden
          for: [profile, '$get(visual_glow_components).value']
          if: '$profile.mode === "custom" || $profile.mode === "off"'
          id: '$: "visual_glow_source_" + $profile.id'
          key: '$: "visual_glow_source_" + $profile.id'
          ignore: true
          modelValue: $profile

    - group: components
      label: 公共组件
      formSchema:
        - $el: style
          attrs: {hidden: true}
          children: *sky_settings_segments_css
        - $formkit: radio
          outer-class: sky-setting-segments
          legend-class: "$reset sr-only"
          label: 公共组件
          value: sidebar
          options:
            - {label: 侧边栏, value: sidebar}
            - {label: 悬浮栏, value: dock}
            - {label: 分享平台, value: share}
            - {label: 列表样式与封面, value: lists}
            - {label: 顶部, value: nav}
            - {label: 页脚, value: footer}
          ignore: true
          id: sky_component_section
        - $cmp: SkyBlogSettingsFeedback
        - $formkit: hidden
          for: [ruleArea, [sidebar, dock, share, post_list]]
          id: '$: "sky_rule_count_" + $ruleArea'
          key: '$: "sky_rule_count_" + $ruleArea'
          ignore: true
          modelValue: >-
            $: (($get($ruleArea + "_suites").value && $get($ruleArea + "_suites").value.length) || 0) +
            (($get($ruleArea + "_overrides").value && $get($ruleArea + "_overrides").value.length) || 0)
        - $formkit: list
          for: [overrideArray, [sidebar_overrides, dock_overrides, share_overrides, post_list_overrides]]
          id: '$: $overrideArray + "_assigned_hosts"'
          key: $overrideArray
          ignore: true
          __raw__sectionsSchema: *sky_hidden_option_list
          children:
            - $formkit: hidden
              for: [entry, index, '$get($overrideArray).value']
              index: $index
              key: $index
              modelValue: $entry.host
        - $formkit: hidden
          id: sky_post_list_scopes
          ignore: true
          value:
            - {label: 首页, value: index}
            - {label: 分类, value: category}
            - {label: 标签, value: tag}
        - $formkit: group
          name: sidebar_settings
          label: 全站默认
          value:
            position: right
            widgets:
              - author_card
              - steam_card
              - blog_stats
              - categories
              - tags
              - popular_posts
              - recent_posts
            popular_posts_count: 5
            recent_posts_count: 5
            welcome_card_config:
              fallback_region: 北京
            online_stats_config:
              show_hot_pages: true
            archive_sidebar_config:
              title: 归档
            bangumi_card_config:
              type_num: 1
              status: 2
              size: 6
          children:
            - $formkit: radio
              __raw__outer-class: *sky_settings_choice_outer_class
              fieldset-class: *sky_settings_choice_fieldset_class
              __raw__legend-class: *sky_settings_choice_legend_class
              options-class: *sky_settings_choice_options_class
              name: position
              label: 位置
              value: right
              options:
                - label: 左侧
                  value: left
                - label: 右侧
                  value: right
            - $formkit: select
              id: sky_sidebar_widgets
              __raw__sectionsSchema:
                outer:
                  attrs:
                    data-sky-settings-choices: sky_sidebar_widgets
              name: widgets
              label: 小工具与顺序
              help: 按页面设置见「场景规则定制」。
              searchable: true
              multiple: true
              sortable: true
              clearable: true
              placeholder: 添加小工具
              options:
                - {label: &widget_welcome_card 欢迎卡片（天气）, value: welcome_card}
                - {label: &widget_author_card 作者卡片, value: author_card}
                - {label: &widget_blog_stats 博客统计, value: blog_stats}
                - {label: &widget_categories 文章分类, value: categories}
                - {label: &widget_tags 标签云, value: tags}
                - {label: &widget_popular_posts 热门文章, value: popular_posts}
                - {label: &widget_recent_posts 最新文章, value: recent_posts}
                - {label: &widget_steam_card Steam 卡片, value: steam_card}
                - {label: &widget_bangumi_card 追番卡片, value: bangumi_card}
                - {label: &widget_online_stats 在线统计, value: online_stats}
            - $el: details
              attrs:
                class: sky-settings-details
              children:
                - $el: summary
                  children: 小工具参数
                - $el: div
                  attrs: { class: pt-3 }
                  children:
                    - $formkit: radio
                      id: sky_sidebar_widget_options
                      label: 选择小工具参数
                      outer-class: sky-setting-segments sky-settings-subnav
                      legend-class: "$reset sr-only"
                      ignore: true
                      value: posts
                      options:
                        - {label: 文章数量, value: posts}
                        - {label: 欢迎天气, value: welcome}
                        - {label: 在线统计, value: online}
                        - {label: 归档导航, value: archives}
                        - {label: 追番卡片, value: bangumi}
                    - $formkit: number
                      name: popular_posts_count
                      label: 热门文章数量
                      __raw__outer-class: &sky_settings_number_outer_class "$remove:py-4 $remove:first:pt-0 $remove:last:pb-0 sky-settings-number-row"
                      wrapper-class: &sky_settings_number_wrapper_class "$reset sky-settings-number-wrapper"
                      __raw__inner-class: &sky_settings_number_inner_class "$remove:w-full $remove:sm:max-w-lg $remove:transition-all sky-settings-number-control"
                      __raw__input-class: &sky_settings_number_input_class "$remove:px-3 sky-settings-number-input"
                      value: 5
                      min: 3
                      max: 10
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'posts'
                    - $formkit: number
                      name: recent_posts_count
                      label: 最新文章数量
                      __raw__outer-class: *sky_settings_number_outer_class
                      wrapper-class: *sky_settings_number_wrapper_class
                      __raw__inner-class: *sky_settings_number_inner_class
                      __raw__input-class: *sky_settings_number_input_class
                      value: 5
                      min: 3
                      max: 10
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'posts'
                    - $formkit: group
                      name: welcome_card_config
                      label: 欢迎卡片
                      value:
                        fallback_region: "北京"
                      children:
                        - $formkit: text
                          name: fallback_region
                          label: 天气回退地区
                          help: 定位失败时使用此地区。
                          value: "北京"
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'welcome'
                    - $formkit: group
                      name: online_stats_config
                      label: 在线统计
                      value:
                        show_hot_pages: true
                      children:
                        - $formkit: switch
                          name: show_hot_pages
                          label: 显示热门页面
                          value: true
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'online'
                    - $formkit: group
                      name: archive_sidebar_config
                      key: archive_settings_sidebar_settings_archive_sidebar_config_field
                      label: 归档导航
                      value:
                        title: 归档
                      children:
                        - $formkit: text
                          name: title
                          label: 自定义标题
                        - $formkit: iconify
                          name: icon
                          label: 自定义图标
                          format: svg
                          value-only: true
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'archives'
                    - $formkit: group
                      name: bangumi_card_config
                      label: 追番卡片
                      value:
                        type_num: 1
                        status: 2
                        size: 6
                      children:
                        - $formkit: radio
                          __raw__outer-class: *sky_settings_choice_outer_class
                          fieldset-class: *sky_settings_choice_fieldset_class
                          __raw__legend-class: *sky_settings_choice_legend_class
                          options-class: *sky_settings_choice_options_class
                          name: type_num
                          label: 列表类型
                          value: 1
                          options:
                            - label: 追番
                              value: 1
                            - label: 追剧
                              value: 2
                        - $formkit: radio
                          __raw__outer-class: *sky_settings_choice_outer_class
                          fieldset-class: *sky_settings_choice_fieldset_class
                          __raw__legend-class: *sky_settings_choice_legend_class
                          options-class: *sky_settings_choice_options_class
                          name: status
                          label: 观看状态
                          value: 2
                          options:
                            - label: 全部
                              value: 0
                            - label: 想看
                              value: 1
                            - label: 在看
                              value: 2
                            - label: 已看
                              value: 3
                        - $formkit: number
                          name: size
                          label: 展示数量
                          __raw__outer-class: *sky_settings_number_outer_class
                          wrapper-class: *sky_settings_number_wrapper_class
                          __raw__inner-class: *sky_settings_number_inner_class
                          __raw__input-class: *sky_settings_number_input_class
                          value: 6
                          min: 1
                          max: 12
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            hidden: $get(sky_sidebar_widget_options).value !== 'bangumi'

          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_component_section).value != 'sidebar'
        - $el: div
          attrs:
            class: py-4
            hidden: $get(sky_component_section).value !== 'sidebar'
          children:
            - $cmp: SkyBlogSettingsRules
              props:
                sectionId: sky-sidebar-rules
                description: 按页面调整侧边栏的显示、位置和小工具。
                count: $get(sky_rule_count_sidebar).value
                priority: &sky_scene_priority 单规则的已设项优先，组规则从上往下逐项匹配。
              children:
                - $formkit: array
                  outer-class: sky-settings-rule-array
                  id: sidebar_suites
                  name: sidebar_suites
                  label: 组规则定制
                  value: []
                  addLabel: 添加组规则
                  sortable: true
                  itemLabels:
                    - type: text
                      label: $value.title
                    - {type: text, label: '$value.hosts.0'}
                    - {type: text, label: '$value.hosts.1'}
                    - {type: text, label: '$value.hosts.2'}
                    - {type: text, label: '$value.hosts.3'}
                    - {type: text, label: '$value.hosts.4'}
                    - {type: text, label: '$value.hosts.5'}
                    - {type: text, label: '$value.hosts.6'}
                    - {type: text, label: '$value.hosts.7'}
                    - {type: text, label: '$value.hosts.8'}
                    - {type: text, label: '$value.position'}
                  emptyText: ""
                  children:
                    - $formkit: text
                      name: title
                      label: 规则名称
                      validation: required|length:1,40
                    - $formkit: select
                      if: $value
                      key: sidebar_suite_hosts
                      name: hosts
                      label: 适用页面
                      sortable: false
                      searchable: true
                      options: &sidebar_hosts
                        - {label: 首页, value: index}
                        - {label: 文章详情页, value: article}
                        - {label: 分类页, value: category}
                        - {label: 标签页, value: tag}
                        - {label: 归档页, value: archive}
                        - {label: 作者页, value: author}
                        - {label: 友链页, value: links}
                        - {label: 瞬间页, value: moments}
                        - {label: 装备页, value: equipment}
                      multiple: true
                      clearable: true
                      value: []
                      validation: required
                    - $formkit: nativeGroup
                      name: hosts
                      if: $value == undefined
                      key: sidebar_suite_host_labels
                      children:
                        - $formkit: nativeSelect
                          for: [index, [0, 1, 2, 3, 4, 5, 6, 7, 8]]
                          name: '$: "" + $index'
                          key: $index
                          options: *sidebar_hosts
                    - $formkit: nativeSelect
                      name: position
                      key: sidebar_suite_position_label
                      if: $value == undefined
                      options:
                        - {label: "", value: "inherit"}
                        - {label: "左侧", value: "left"}
                        - {label: "右侧", value: "right"}
                    - $formkit: radio
                      __raw__outer-class: *sky_settings_choice_outer_class
                      fieldset-class: *sky_settings_choice_fieldset_class
                      __raw__legend-class: *sky_settings_choice_legend_class
                      options-class: *sky_settings_choice_options_class
                      name: position
                      key: sidebar_suite_position_edit
                      if: $value
                      label: 位置
                      value: inherit
                      options:
                        - {label: 跟随上级, value: inherit}
                        - {label: 左侧, value: left}
                        - {label: 右侧, value: right}
                    - $formkit: switch
                      name: override_widgets
                      id: sidebar_suites_use_widgets
                      key: sidebar_suites_use_widgets
                      if: $value
                      label: 调整小工具列表
                      value: false
                    - $formkit: select
                      id: sky_sidebar_suite_widgets
                      __raw__sectionsSchema:
                        outer:
                          attrs:
                            data-sky-settings-choices: sky_sidebar_suite_widgets
                      name: widgets
                      label: 小工具与顺序
                      help: 清空后该规则不显示小工具。
                      searchable: true
                      multiple: true
                      sortable: true
                      clearable: true
                      placeholder: 添加小工具
                      value: []
                      options: &sidebar_override_widgets
                        - {label: *widget_welcome_card, value: welcome_card}
                        - {label: *widget_author_card, value: author_card}
                        - {label: *widget_blog_stats, value: blog_stats}
                        - {label: *widget_categories, value: categories}
                        - {label: *widget_tags, value: tags}
                        - {label: *widget_popular_posts, value: popular_posts}
                        - {label: *widget_recent_posts, value: recent_posts}
                        - {label: *widget_steam_card, value: steam_card}
                        - {label: *widget_bangumi_card, value: bangumi_card}
                        - {label: *widget_online_stats, value: online_stats}
                        - {label: 文章目录（文章页）, value: toc}
