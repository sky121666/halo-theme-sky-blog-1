          ignore: true
          modelValue: $target
        - $el: div
          attrs:
            class: py-4
            hidden: $get(sky_visual_section).value !== 'glow'
          children:
            - $cmp: SkyBlogSettingsRules
              props:
                sectionId: sky-glow-customizations
                title: 组件定制
                description: 为组件、页面或分组单独设置光晕。
                listLabel: 定制列表
                emptyText: 暂无定制，使用继承设置。
                count: '$get(visual_glow_components).value && $get(visual_glow_components).value.length'
                priority: 删除定制并保存，恢复继承。
              children:
                - $formkit: array
                  name: components
                  id: visual_glow_components
                  label: 组件定制
                  outer-class: sky-settings-rule-array
                  label-class: "$reset sr-only"
                  value: []
                  addLabel: 添加定制
                  max: $get(visual_glow_catalog).value.length
                  emptyText: ""
                  itemLabels:
                    - {type: text, label: '$value.id'}
                    - {type: text, label: '$value.mode'}
