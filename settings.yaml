        # 其他功能 (侧边栏与评论)
        # ===== 侧边栏设置 =====
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'editor' || $get(sky_plugin_section).value !== 'links' || $get(sky_show_links).value === false
