              attrs:
                class: mb-3 max-w-lg text-sm text-gray-600
              children: 目录和文档树入口需开启对应页面的悬浮栏。悬浮栏与分享平台在「公共组件」按文档场景设置。
            - $formkit: group
              name: doc_settings
              label: 文档正文
              value:
                enable_share: true
                enable_toc_drawer: true
                enable_sidebar_drawer: true
              children:
                - $formkit: switch
                  id: docsme_doc_enable_share
                  name: enable_share
                  label: 显示分享按钮
                  value: true
                - $formkit: switch
                  id: docsme_doc_enable_toc
                  name: enable_toc_drawer
                  label: 显示正文目录入口
                  value: true
                - $formkit: switch
                  id: docsme_doc_enable_sidebar
                  name: enable_sidebar_drawer
                  label: 显示文档树入口
                  value: true
        # 文档列表页设置 (docs.html)
            - $formkit: group
              name: doc_catalog_settings
              label: 文档目录页
              value:
                enable_sidebar_drawer: true
              children:
                - $formkit: switch
                  name: enable_sidebar_drawer
                  label: 显示文档树入口
                  value: true

          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'editor' || $get(sky_plugin_section).value !== 'docsme' || $get(sky_show_docsme).value === false
        - $formkit: group
          name: bangumi
          label: 追番
          value:
            page_title: 追番列表
            page_description: 记录我的二次元之旅
          children:
            - $formkit: text
              name: page_title
              label: 页面标题
              value: "追番列表"
              placeholder: "追番页面的标题"
            - $formkit: textarea
              name: page_description
              label: 页面描述
              value: "记录我的二次元之旅"
              rows: 2
              placeholder: "追番页面的描述"
            - $el: p
              attrs:
                class: mb-3 max-w-lg text-sm text-gray-600
              children: 侧栏追番卡片在「公共组件 → 侧边栏 → 小工具参数」设置。
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'editor' || $get(sky_plugin_section).value !== 'bangumi' || $get(sky_show_bangumi).value === false
        - $formkit: group
          name: equipment
          label: 装备
          value:
            basic_info:
              page_title: 我的装备
              page_subtitle: 好物分享
              page_description: 分享我日常使用的硬件与软件
            style_settings:
              mode: tech
              tab_style: pills
              hero_background: https://www.dmoe.cc/random.php
          children:
            - $formkit: group
              name: basic_info
              label: 页面内容
              value:
                page_title: "我的装备"
                page_subtitle: "好物分享"
                page_description: "分享我日常使用的硬件与软件"
              children:
                - $formkit: text
                  name: page_title
                  label: 页面标题
                  value: "我的装备"
                  placeholder: "装备页面的标题"
                - $formkit: text
                  name: page_subtitle
                  label: 副标题
                  value: "好物分享"
                  placeholder: "页面副标题"
                - $formkit: textarea
                  name: page_description
                  label: 页面描述
                  value: "分享我日常使用的硬件与软件"
                  placeholder: "页面描述信息"
                  rows: 2

        # ===== 风格设置 =====
            - $formkit: group
              name: style_settings
              label: 卡片与分组
              value:
                mode: "tech"
                tab_style: "pills"
                hero_background: "https://www.dmoe.cc/random.php"
              children:
                - $formkit: radio
                  outer-class: sky-settings-preview
                  __raw__sectionsSchema: *sky_settings_preview_label
                  id: mode
                  name: mode
                  label: 装备卡片布局
                  help: 应用于整个装备页。单张卡片的强调色在对应装备的元数据里设置。
                  value: tech
                  options:
                    - label: 3D 卡片
                      value: tech
                      attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/equipment/tech.svg}
                    - label: 带页首背景图的卡片
                      value: simple
                      attrs: {dataPreview: /themes/theme-sky-blog-1/assets/previews/equipment/simple.svg}
                - $formkit: radio
                  outer-class: sky-setting-segments
                  name: tab_style
                  key: tab_style_field
                  label: 分组按钮样式
                  value: pills
                  options:
                    - label: 药丸胶囊
                      value: pills
                    - label: 芯片边框
                      value: chips
                    - label: 下划线
                      value: underline
                    - label: 玻璃
                      value: glass
                - $formkit: attachment
                  preserve: true
                  name: hero_background
                  key: hero_background_field
                  label: 页首背景图
                  help: 建议使用 16:9 图片。
                  if: $get(mode).value === 'simple'
                  value: "https://www.dmoe.cc/random.php"
                  accepts:
                    - "image/*"

        # ===== 侧边栏设置 =====
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'editor' || $get(sky_plugin_section).value !== 'equipment' || $get(sky_show_equipment).value === false
        - $formkit: group
          name: ncm
          label: 网抑云
          help: 歌单、播放开关和位置在「工具 → 网抑云」管理。
          value:
            color_source: theme
            light_custom_color: "#395f91"
            dark_custom_color: "#acc9fc"
          children:
            - $formkit: radio
              name: color_source
              id: sky_ncm_color_source
              label: 小播放器主色
              outer-class: sky-setting-segments
              value: theme
              options:
                - {label: 跟随主题, value: theme}
                - {label: 插件默认, value: plugin}
                - {label: 自定义, value: custom}
            - $formkit: color
              name: light_custom_color
              key: sky_ncm_light_custom_color
              label: 浅色主色
              value: "#395f91"
              preserve: true
              if: $get(sky_ncm_color_source).value === 'custom'
            - $formkit: color
              name: dark_custom_color
              key: sky_ncm_dark_custom_color
              label: 深色主色
              value: "#acc9fc"
              preserve: true
              if: $get(sky_ncm_color_source).value === 'custom'
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'editor' || $get(sky_plugin_section).value !== 'ncm' || $get(sky_show_ncm).value === false
        - $formkit: group
          name: visible_modules
          label: 设置入口
          help: 控制主题后台入口。插件启停请前往 Halo「插件」。
          inner-class: "$reset sky-settings-switch-grid"
          value:
            links: true
            photos: true
            moments: true
            docsme: true
            bangumi: true
            equipment: true
            ncm: true
          children:
            - $formkit: switch
              name: links
              id: sky_show_links
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 友链
              value: true
              __raw__sectionsSchema:
                outer:
                  attrs:
                    id: sky-plugin-entry-links
            - $formkit: switch
              name: photos
              id: sky_show_photos
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 图库
              value: true
            - $formkit: switch
              name: moments
              id: sky_show_moments
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 瞬间
              value: true
            - $formkit: switch
              name: docsme
              id: sky_show_docsme
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 文档
              value: true
            - $formkit: switch
              name: bangumi
              id: sky_show_bangumi
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 追番
              value: true
            - $formkit: switch
              name: equipment
              id: sky_show_equipment
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 装备
              value: true
            - $formkit: switch
              name: ncm
              id: sky_show_ncm
              __raw__outer-class: *sky_settings_inline_switch_outer_class
              wrapper-class: *sky_settings_inline_switch_wrapper_class
              label: 网抑云
              value: true
          __raw__sectionsSchema:
            outer:
              attrs:
                hidden: $get(sky_plugin_settings_section).value !== 'visibility'
