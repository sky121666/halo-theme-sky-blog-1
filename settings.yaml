                    # Halo reads this hidden field's options to resolve saved card labels.
                    - $formkit: nativeSelect
                      name: id
                      if: '$value == undefined'
                      key: visual_glow_target_label
                      options: *id002
                    - $el: div
                      if: '$value && $get("visual_glow_source_" + $value.id).value == undefined'
                      key: visual_glow_picker
                      attrs:
                        id: visual_glow_picker
                        role: group
                        aria-label: 筛选待添加对象
                        class: "mb-3 flex flex-col gap-y-2"
                        # Keep the category widths from sizing the dialog.
                        style: {contain: inline-size}
                      children:
                        - $el: style
                          key: visual_glow_category_scroll_style
                          children: |
                            #visual_glow_category .formkit-options {
                              --sky-visual-glow-edge-width: 18px;
                              --sky-visual-glow-edge-color: rgb(0 0 0 / 0.18);
                              column-gap: 6px;
                              scroll-padding-inline: 4px;
                            }

                            #visual_glow_category input[type="radio"] { margin-inline-end: 5px; }

                            #visual_glow_category .formkit-options::-webkit-scrollbar {
                              display: none;
                            }

                            @media (max-width: 390px) {
                              #visual_glow_category .formkit-options { column-gap: 3px; }
                              #visual_glow_category .formkit-option { flex: 1 0 auto; }
                              #visual_glow_category label {
                                position: relative;
                                justify-content: center;
                                padding-inline: 2px;
                                border: 1px solid transparent;
                                border-radius: 6px;
                              }
                              #visual_glow_category input[type="radio"] {
                                position: absolute;
                                inset: 0;
                                width: 100%;
                                height: 100%;
                                margin: 0;
                                opacity: 0;
                              }
                              #visual_glow_category label:has(input:checked) {
                                border-color: #4ccba0;
                                background: #ebf9f3;
                              }
                              #visual_glow_category label:has(input:checked) .formkit-label { color: #146846; }
                              #visual_glow_category label:has(input:focus-visible) {
                                outline: 2px solid #2563eb;
                                outline-offset: -2px;
                              }
                            }

                            @media (min-width: 640px) {
                              #visual_glow_picker {
                                row-gap: 12px;
                              }

                              #visual_glow_category .formkit-options {
                                column-gap: 16px;
                              }

                              #visual_glow_category input[type="radio"] { margin-inline-end: 8px; }
                            }

                            @supports (animation-timeline: scroll(self inline)) {
                              #visual_glow_category .formkit-options {
                                background-image:
                                  linear-gradient(to right, var(--sky-visual-glow-edge-color), transparent),
                                  linear-gradient(to left, var(--sky-visual-glow-edge-color), transparent);
                                background-position: left, right;
                                background-repeat: no-repeat;
                                background-size: 0 100%, 0 100%;
                                animation: sky-visual-glow-edge-fade auto linear both;
                                animation-timeline: scroll(self inline);
                              }

                              @keyframes sky-visual-glow-edge-fade {
                                from {
                                  background-size: 0 100%, var(--sky-visual-glow-edge-width) 100%;
                                }
                                1%, 99% {
                                  background-size: var(--sky-visual-glow-edge-width) 100%, var(--sky-visual-glow-edge-width) 100%;
                                }
                                to {
                                  background-size: var(--sky-visual-glow-edge-width) 100%, 0 100%;
                                }
                              }
                            }

                            @supports not (animation-timeline: scroll(self inline)) {
                              #visual_glow_category .formkit-options {
                                /* The local layers cover the hints at the scroll boundaries. */
                                background:
                                  linear-gradient(to right, Canvas 50%, transparent) left / calc(2 * var(--sky-visual-glow-edge-width)) 100% local no-repeat,
                                  linear-gradient(to left, Canvas 50%, transparent) right / calc(2 * var(--sky-visual-glow-edge-width)) 100% local no-repeat,
                                  linear-gradient(to right, var(--sky-visual-glow-edge-color), transparent) left / var(--sky-visual-glow-edge-width) 100% scroll no-repeat,
                                  linear-gradient(to left, var(--sky-visual-glow-edge-color), transparent) right / var(--sky-visual-glow-edge-width) 100% scroll no-repeat;
                              }
                            }
