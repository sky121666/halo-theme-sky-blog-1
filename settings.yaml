                          placeholder: "admin@example.com"
                        - $formkit: textarea
                          preserve: true
                          name: blogger_description
                          key: links_settings_apply_settings_blogger_description_field
                          if: $get(apply_enable).value
                          label: 站点描述
                          rows: 2
              __raw__sectionsSchema:
                outer:
                  attrs:
                    hidden: $get(sky_links_section).value !== 'apply'
