name: CD

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  package:
    name: Package theme
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm from packageManager
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: test "$RELEASE_TAG" = "v$(node -p 'require("./package.json").version')"

      - name: Install frozen dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Check formatting
        run: pnpm run format:check

      - name: Audit dependencies
        run: pnpm audit

      - name: Build and package theme
        run: pnpm run build

      - name: Verify generated artifacts are committed
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=all)"

      - name: Upload theme package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: theme-package
          path: dist/*.zip
          if-no-files-found: error

  github-release:
    name: Upload GitHub release asset
    runs-on: ubuntu-24.04
    needs: package
    permissions:
      contents: write
    steps:
      - name: Download theme package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-package
          path: dist

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --clobber

  appstore-release:
    name: Publish to Halo App Store
    runs-on: ubuntu-24.04
    needs:
      - package
      - github-release
    permissions:
      contents: read
    steps:
      - name: Checkout release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download theme package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: theme-package
          path: dist

      - name: Publish App Store release
        uses: halo-sigs/app-store-release-action@0b0b351312114a42a544471c1ee0b78d3f635e51 # v4 branch, 2026-06-01
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          app-id: app-squauk4h
          release-id: ${{ github.event.release.id }}
          assets-dir: dist
          halo-pat: ${{ secrets.HALO_PAT }}
