<!doctype html>
<html
  xmlns:th="https://www.thymeleaf.org"
  th:lang="${#locale.toLanguageTag}"
  th:replace="${error.status == 404} ? ~{layout :: html(head = ~{::error-head}, content = ~{::error-content})} : _"
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <th:block th:replace="~{modules/theme-script :: head}" />
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <th:block th:fragment="error-head">
      <meta name="robots" content="noindex, nofollow" />
      <title th:text="${error.status} + ' - ' + ${#strings.defaultString(error.title, '页面访问错误')} + ' - ' + ${site.title}">
        页面访问错误
      </title>
      <link rel="icon" type="image/x-icon" th:href="${site.favicon}" />
      <style>
        .error-page {
          min-block-size: 62svh;
          padding-block: clamp(2rem, 8vh, 4rem);
          display: grid;
          place-items: center;
          position: relative;
          isolation: isolate;
          overflow: clip;
        }

        .error-actions .btn { transition: transform 150ms ease-out, background-color 150ms ease-out; }
        .error-actions .btn:active { transform: scale(.97); }

        @media (prefers-reduced-motion: reduce) {
          .error-actions .btn { transition: none; }
          .error-actions .btn:active { transform: none; }
        }
      </style>
    </th:block>
  </head>
  <body class="bg-base-100 text-base-content flex min-h-screen items-center justify-center">
    <main class="w-full px-4">
      <section th:fragment="error-content" class="error-page text-center" data-theme-swup>
        <div
          aria-hidden="true"
          class="text-base-content/5 pointer-events-none absolute inset-0 -z-10 grid place-items-center text-[10rem] leading-none font-black select-none md:text-[16rem]"
          th:text="${error.status}"
        >404</div>
        <div class="max-w-3xl px-2 sm:px-6">
          <div aria-hidden="true" data-glow-owner="system" class="sky-glow-card bg-base-200/70 mb-8 inline-flex size-20 items-center justify-center rounded-3xl shadow-inner">
            <span th:if="${error.status == 404}" class="icon-[heroicons--map] size-10 opacity-60"></span>
            <span th:if="${error.status == 500}" class="icon-[heroicons--server-stack] size-10 opacity-60"></span>
            <span th:if="${error.status != 404 and error.status != 500}" class="icon-[heroicons--exclamation-triangle] size-10 opacity-60"></span>
          </div>
          <h1 class="mb-4 text-3xl font-bold tracking-tight md:text-5xl" th:text="${#strings.defaultString(error.title, '页面访问错误')}">
            页面访问错误
          </h1>
          <p class="text-base-content/70 mx-auto mb-10 max-w-lg text-lg leading-relaxed" th:text="${#strings.defaultString(error.detail, '当前无法访问此内容，请稍后重试。')}"></p>
          <div class="error-actions flex flex-col items-center justify-center gap-3 sm:flex-row">
            <a id="error-home-link" th:href="@{/}" class="btn btn-neutral btn-lg">
              <span aria-hidden="true" class="icon-[heroicons--home] size-5"></span>
              返回首页
            </a>
            <button type="button" onclick="history.length > 1 ? history.back() : document.getElementById('error-home-link').click()" class="btn btn-outline btn-lg">
              返回上一页
            </button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
