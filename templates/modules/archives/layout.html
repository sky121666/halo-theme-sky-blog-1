<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--        归档页面布局                         -->
  <!-- 路由：/archives, /archives/:year, /archives/:year/:month -->
  <!-- ========================================== -->

  <head
    th:with="pageNumber=${archives?.page ?: 1},
             archiveBase=${archives?.prevUrl != null and archives.prevUrl.contains('/page/') ? archives.prevUrl.substring(0, archives.prevUrl.indexOf('/page/')) : archives?.prevUrl},
             hasYearMonth=${archiveBase != null and archiveBase.matches('.*/[0-9]{4}/[0-9]{2}$')},
             hasYear=${!hasYearMonth and archiveBase != null and archiveBase.matches('.*/[0-9]{4}$')},
             archiveYear=${hasYearMonth ? archiveBase.substring(archiveBase.length() - 7, archiveBase.length() - 3) : (hasYear ? archiveBase.substring(archiveBase.length() - 4) : null)},
             archiveMonth=${hasYearMonth ? archiveBase.substring(archiveBase.length() - 2) : null},
             pageTitle=${hasYearMonth ? archiveYear + ' 年 ' + archiveMonth + ' 月文章归档' : (hasYear ? archiveYear + ' 年文章归档' : '文章归档')},
             pageCanonical=${archiveBase != null ? (pageNumber > 1 ? archiveBase + '/page/' + pageNumber : archiveBase) : (!#strings.isEmpty(site.routes?.archivesUri) ? site.routes.archivesUri : '/archives')},
             documentTitle=${pageTitle + (pageNumber > 1 ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 启用 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 防止主题闪烁 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${'按时间浏览 ' + site.title + ' 的' + pageTitle}, ${pageCanonical}, ${site.logo}, 'website')}"
    />
    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/archives.css?v={version}(version=${theme.spec.version})}" />
    <!-- 音乐播放器 CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">
      <!-- 加载屏幕 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域 -->
      <main id="swup" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="${content}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig(${theme.config.archive_settings}, 'comment')}" />
    </div>

    <!-- JavaScript -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/archives.js?v={version}(version=${theme.spec.version})}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
    <!-- 悬浮音乐播放器 -->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
