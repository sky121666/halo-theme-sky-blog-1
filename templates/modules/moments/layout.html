<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--     瞬间页面布局                             -->
  <!-- ========================================== -->

  <head
    th:with="isDetail=${_templateId == 'moment'},
             pageNumber=${moments?.page ?: 1},
             momentRaw=${moment?.spec?.content?.raw},
             momentText=${!#strings.isEmpty(momentRaw) ? momentRaw.replaceAll('<[^>]*>', ' ').trim() : ''},
             pageTitle=${isDetail ? ((moment?.owner?.displayName ?: '访客') + ' 于 ' + #temporals.format(moment.spec.releaseTime, 'yyyy-MM-dd HH:mm') + ' 发布的瞬间') : (theme.config.moments_settings?.basic_info?.page_title ?: (title ?: '瞬间'))},
             documentTitle=${pageTitle + (!isDetail and pageNumber > 1 ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title},
             baseCanonical=${isDetail and moment?.metadata?.name != null ? '/moments/' + moment.metadata.name : '/moments'},
             pageCanonical=${!isDetail and pageNumber > 1 ? baseCanonical + '/page/' + pageNumber : baseCanonical},
             pageDescription=${isDetail ? (!#strings.isEmpty(momentText) ? (momentText.length() > 160 ? momentText.substring(0, 160) + '…' : momentText) : null) : theme.config.moments_settings?.basic_info?.page_description}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 启用 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 防止主题闪烁 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${pageDescription}, ${pageCanonical}, ${site.logo}, ${isDetail ? 'article' : 'website'})}"
    />

    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/moments.css?v={version}(version=${theme.spec.version})}" />
    <!-- 音乐播放器 CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen relative flex flex-col ' + ${bgClass}"
  >
    <div class="relative z-10">
      <!-- 加载屏幕 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容 -->
      <main id="swup" class="flex-1">
        <th:block th:replace="${content}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig(${theme.config.moments_settings}, 'basic')}" />
    </div>

    <!-- JavaScript -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/moments.js?v={version}(version=${theme.spec.version})}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
    <!-- 悬浮音乐播放器 -->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
