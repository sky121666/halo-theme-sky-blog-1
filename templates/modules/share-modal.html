<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--          通用分享弹窗组件                    -->
<!-- ========================================== -->
<!--
  使用方式：
  <th:block th:replace="~{modules/share-modal :: shareModal(
    title='分享文章',
    shareUrl=${post.status.permalink},
    shareTitle=${post.spec.title},
    shareItemIds=${theme.config.article.post_interaction.share_settings.share_item_ids}
  )}" />
  
  触发方式：
  <button @click="$dispatch('open-share-modal')">分享</button>
-->

<div th:fragment="shareModal(title, shareUrl, shareTitle, shareItemIds)"
     x-data="shareModal"
     @open-share-modal.window="openModal($event.target)"
     th:attr="data-share-url=${shareUrl},
              data-share-title=${shareTitle},
              data-qrcode-page-url=@{/assets/qrcode/qrcode-share.html?v={version}(version=${theme.spec.version})}"
     th:data-share-item-ids-configured="${shareItemIds != null and shareItemIds.toString() != 'null'}"
     th:data-share-item-ids="${shareItemIds != null and shareItemIds.toString() != 'null' ? #strings.listJoin(#lists.toList(shareItemIds), ',') : ''}">

  <!-- 弹窗容器 - 使用 teleport 确保在视口顶层 -->
  <template x-teleport="body">
    <dialog x-ref="shareOverlay" x-show="isOpen" @cancel.prevent="closeModal()"
            aria-modal="true" aria-labelledby="share-modal-title"
            class="fixed inset-0 m-0 h-full max-h-none w-full max-w-none bg-transparent p-0 text-base-content" x-cloak>
      <!-- 遮罩 -->
      <div class="absolute inset-0 bg-black/50 backdrop-blur-sm"
           aria-hidden="true"
           x-show="isOpen"
           x-transition:enter="transition ease-out duration-300"
           x-transition:enter-start="opacity-0"
           x-transition:enter-end="opacity-100"
           x-transition:leave="transition ease-in duration-200"
           x-transition:leave-start="opacity-100"
           x-transition:leave-end="opacity-0"
            @click="closeModal()"></div>
      
      <!-- 弹窗内容 - PC居中 / 移动端底部 -->
      <div class="absolute inset-0 flex items-end sm:items-center justify-center p-0 sm:p-4" @click.self="closeModal()">
        <div x-show="isOpen"
             x-ref="shareDialog"
             tabindex="-1"
             @keydown.tab="trapFocus($event)"
             x-transition:enter="transition ease-out duration-300"
             x-transition:enter-start="translate-y-full sm:translate-y-0 sm:scale-95 sm:opacity-0"
             x-transition:enter-end="translate-y-0 sm:scale-100 sm:opacity-100"
             x-transition:leave="transition ease-in duration-200"
             x-transition:leave-start="translate-y-0 sm:scale-100 sm:opacity-100"
             x-transition:leave-end="translate-y-full sm:translate-y-0 sm:scale-95 sm:opacity-0"
             class="w-full sm:w-auto sm:min-w-80">
          <div class="bg-base-100 rounded-t-2xl sm:rounded-2xl shadow-2xl overflow-hidden">
            <!-- 移动端拖拽指示条 -->
            <div class="flex justify-center pt-3 pb-1 sm:hidden">
              <div class="w-10 h-1 bg-base-300 rounded-full"></div>
            </div>
            
            <!-- 标题栏 -->
            <div class="flex items-center justify-between px-5 py-4 border-b border-base-200">
              <h3 id="share-modal-title" class="text-base font-semibold" th:text="${title} ?: '分享'">分享</h3>
              <button type="button"
                      aria-label="关闭分享弹窗"
                       @click="closeModal()"
                      class="btn btn-ghost btn-circle btn-sm">
                <span class="icon-[heroicons--x-mark] size-5" aria-hidden="true"></span>
              </button>
            </div>
            
            <!-- 分享平台 -->
            <div x-show="activeShareItems.length > 0" class="p-5">
              <div class="flex justify-center gap-5 flex-wrap">
                <template x-for="item in activeShareItems" :key="item.id">
                  <button type="button"
                          :aria-label="'分享到' + item.name"
                           @click="handleShare(item.id)"
                          class="flex flex-col items-center gap-2 w-14 active:scale-95 transition-transform">
                    <div class="w-12 h-12 rounded-xl flex items-center justify-center"
                         :style="'background:' + item.color">
                      <span class="size-6 text-white" :class="item.icon"></span>
                    </div>
                    <span class="text-xs text-base-content/60" x-text="item.name"></span>
                  </button>
                </template>
              </div>
            </div>
            
            <!-- 链接复制区 -->
            <div class="px-5 pb-5" :class="{ 'pt-5': activeShareItems.length === 0 }">
              <div class="flex items-center gap-2 p-2.5 bg-base-200/60 rounded-xl">
                <span class="icon-[heroicons--link] size-4 text-base-content/40 shrink-0 ml-1"></span>
                <input type="text" x-ref="shareLink" x-model="permalink" readonly aria-label="分享链接"
                       class="flex-1 bg-transparent text-sm text-base-content/60 outline-none truncate min-w-0" />
                <button type="button" @click="copyUrl()" class="btn btn-sm btn-primary rounded-lg px-3 shrink-0">
                  <span x-text="copied ? '已复制' : '复制'"></span>
                </button>
              </div>
              <p x-cloak x-show="copyError" x-text="copyError" role="status" aria-live="polite"
                 class="mt-2 text-sm text-error"></p>
            </div>
          </div>
        </div>
      </div>
    </dialog>
  </template>

</div>

</html>
