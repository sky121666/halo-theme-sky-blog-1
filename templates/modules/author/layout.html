<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- 页面头部 -->

  <head
    th:with="pageNumber=${posts?.page ?: 1},
             baseCanonical=${'/authors/' + author.metadata.name},
             pageCanonical=${pageNumber > 1 ? baseCanonical + '/page/' + pageNumber : baseCanonical},
             documentTitle=${author.spec.displayName + ' 的文章' + (pageNumber > 1 ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防止主题闪烁 - 在渲染前立即应用主题 -->
    <th:block th:replace="~{modules/theme-script :: head}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${author.spec.bio}, ${pageCanonical}, ${!#strings.isEmpty(author.spec.avatar) ? author.spec.avatar : site.logo}, 'profile')}"
    />
    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/author.css?v={version}(version=${theme.spec.version})}" />


  </head>

  <body
    th:with="bgConfig = ${theme.config.visual.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域 -->
      <main id="swup" data-page="author" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="~{modules/component-settings :: sidebar('author', ${content})}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig('author', 'basic')}" />
    </div>

    <!-- JavaScript 文件 -->

    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
  </body>
</html>
