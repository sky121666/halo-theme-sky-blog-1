<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- 分页片段（极简版）：仅箭头图标 + 页码 -->
<div th:fragment="pagination(context,prevUrl,nextUrl,totalPages,page,hasPrevious,hasNext)">
  <div class="mt-10 flex items-center justify-center" th:if="${hasPrevious || hasNext}">
    <div class="inline-flex items-center p-1 rounded-full bg-base-200/60 backdrop-blur-md">
      <!-- 上一页 -->
      <a th:if="${hasPrevious}" th:href="@{${prevUrl}}" rel="prev" aria-label="上一页" class="w-9 h-9 flex items-center justify-center rounded-full
                text-base-content/60 hover:text-base-content hover:bg-base-100 
                transition-all duration-200">
        <span class="icon-[heroicons--chevron-left] w-5 h-5" aria-hidden="true"></span>
      </a>
      <span th:unless="${hasPrevious}" aria-disabled="true" aria-label="没有上一页"
        class="w-9 h-9 flex items-center justify-center rounded-full text-base-content/60 opacity-30">
        <span class="icon-[heroicons--chevron-left] w-5 h-5" aria-hidden="true"></span>
      </span>

      <!-- 页码指示器 -->
      <span class="px-4 text-xs font-semibold text-base-content/50 tabular-nums tracking-wide"
        th:text="${page} + ' / ' + ${totalPages}">1 / 1</span>

      <!-- 下一页 -->
      <a th:if="${hasNext}" th:href="@{${nextUrl}}" rel="next" aria-label="下一页" class="w-9 h-9 flex items-center justify-center rounded-full
                text-base-content/60 hover:text-base-content hover:bg-base-100 
                transition-all duration-200">
        <span class="icon-[heroicons--chevron-right] w-5 h-5" aria-hidden="true"></span>
      </a>
      <span th:unless="${hasNext}" aria-disabled="true" aria-label="没有下一页"
        class="w-9 h-9 flex items-center justify-center rounded-full text-base-content/60 opacity-30">
        <span class="icon-[heroicons--chevron-right] w-5 h-5" aria-hidden="true"></span>
      </span>
    </div>
  </div>
</div>

</html>
