<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- 页面头部 -->

  <head
    th:with="pageNumber=${category != null ? (posts?.page ?: 1) : (param.p != null and !#lists.isEmpty(param.p) ? param.p[0] : (param.page != null and !#lists.isEmpty(param.page) ? param.page[0] : '1'))},
             isPaged=${pageNumber.toString() != '1'},
             pageLabel=${category != null ? category.spec.displayName + ' 分类' : '文章分类'},
             documentTitle=${pageLabel + (isPaged ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title},
             baseCanonical=${category != null ? category.status.permalink : (!#strings.isEmpty(site.routes?.categoriesUri) ? site.routes.categoriesUri : '/categories')},
             pageCanonical=${isPaged ? (category != null ? baseCanonical + (baseCanonical.endsWith('/') ? 'page/' : '/page/') + pageNumber : baseCanonical + '?p=' + pageNumber) : baseCanonical}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 启用 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 防止主题闪烁 - 在渲染前立即应用主题 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${category != null ? category.spec.description : null}, ${pageCanonical}, ${category != null and !#strings.isEmpty(category.spec.cover) ? category.spec.cover : site.logo}, 'website')}"
    />
    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/categories.css?v={version}(version=${theme.spec.version})}" />

    <!-- 音乐播放器 CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">
      <!-- 加载屏幕 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域（与 post 布局同级） -->
      <main id="swup" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="${content}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig(${theme.config.category_settings}, 'basic')}" />
    </div>

    <!-- JavaScript 文件：分类页脚本与公共脚本 -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/categories.js?v={version}(version=${theme.spec.version})}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
    <!-- 悬浮音乐播放器 -->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
