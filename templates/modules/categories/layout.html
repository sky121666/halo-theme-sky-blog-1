<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)"
  th:attr="data-site-url=${site.url != null ? site.url.toString() : null}"
  th:with="collectionBase=${!#strings.isEmpty(site.routes?.categoriesUri) ? site.routes.categoriesUri : '/categories'},
           collectionPageSize=${site.post.categoryPageSize ?: 10},
           rawPage=${category == null ? (param.p != null and !#lists.isEmpty(param.p) ? param.p[0] : (param.page != null and !#lists.isEmpty(param.page) ? param.page[0] : '1')) : '1'},
           requestedPage=${rawPage.matches('^[0-9]{1,6}$') ? T(java.lang.Integer).parseInt(rawPage) : 1},
           firstCollectionPage=${category == null ? postFinder.list({page: 1, size: collectionPageSize}) : null},
           collectionPageNumber=${category == null and requestedPage > 0 and requestedPage <= firstCollectionPage.totalPages ? requestedPage : 1},
           collectionPosts=${category == null ? (collectionPageNumber == 1 ? firstCollectionPage : postFinder.list({page: collectionPageNumber, size: collectionPageSize})) : null}">
  <!-- 页面头部 -->

  <head
    th:with="pageNumber=${category != null ? (posts?.page ?: 1) : collectionPageNumber},
             isPaged=${pageNumber.toString() != '1'},
             pageLabel=${category != null ? category.spec.displayName + ' 分类' : '文章分类'},
             documentTitle=${pageLabel + (isPaged ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title},
             baseCanonical=${category != null ? category.status.permalink : collectionBase},
             pageCanonical=${isPaged ? (category != null ? baseCanonical + (baseCanonical.endsWith('/') ? 'page/' : '/page/') + pageNumber : baseCanonical + '?p=' + pageNumber) : baseCanonical}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防止主题闪烁 - 在渲染前立即应用主题 -->
    <th:block th:replace="~{modules/theme-script :: head}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${category != null ? category.spec.description : null}, ${pageCanonical}, ${category != null and !#strings.isEmpty(category.spec.cover) ? category.spec.cover : site.logo}, 'website')}"
    />
    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/categories.css?v={version}(version=${theme.spec.version})}" />


  </head>

  <body
    th:with="bgConfig = ${theme.config.visual.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域（与 post 布局同级） -->
      <main id="swup" data-page="categories" class="mt-6 flex-1 md:mt-8"
        th:attr="data-collection-base=${collectionBase},data-collection-mode=${category == null ? 'query' : 'path'},data-collection-page=${category != null ? (posts?.page ?: 1) : collectionPageNumber},data-collection-total-pages=${category != null ? (posts?.totalPages ?: 0) : (firstCollectionPage?.totalPages ?: 0)}">
        <th:block th:replace="~{modules/component-settings :: sidebar('category', ${content})}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig('category', 'basic')}" />
    </div>

    <!-- JavaScript 文件：分类页脚本与公共脚本 -->

    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
  </body>
</html>
