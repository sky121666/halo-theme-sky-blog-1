<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  <!-- ========================================== -->
  <!--  在线统计组件 - plugin-online 适配          -->
  <!--  API: /apis/online-user.zyx2012.cn/v1alpha1 -->
  <!-- ========================================== -->

  <div
    th:fragment="online"
    class="card bg-base-100/80 border-base-content/5 overflow-hidden rounded-[1.5rem] border shadow-lg backdrop-blur-xl"
    x-data="onlineStats()"
    th:with="onlineCfg = ${theme.config.general.sidebar_settings?.online_stats_config}"
    th:attr="data-show-hot-pages=${onlineCfg?.show_hot_pages != false}"
  >
    <!-- 加载 -->
    <div x-show="loading" class="flex items-center justify-center py-16">
      <span class="loading loading-ring loading-md text-base-content/30"></span>
    </div>

    <!-- 错误 -->
    <div x-show="error && !loading" x-cloak class="py-12 text-center">
      <span class="icon-[heroicons--wifi] text-base-content/20 mx-auto mb-2 block h-6 w-6"></span>
      <p class="text-base-content/40 text-xs">服务暂不可用</p>
    </div>

    <!-- 数据 -->
    <div x-show="!loading && !error" x-cloak class="px-5 py-6">
      <!-- 标题栏 -->
      <div class="mb-6 flex items-center justify-between">
        <div class="text-base-content/60 flex items-center gap-1.5">
          <span class="icon-[heroicons--bolt] h-4 w-4"></span>
          <span class="text-[11px] font-bold tracking-[0.15em] uppercase">Traffic</span>
        </div>
        <span class="relative flex h-2.5 w-2.5">
          <span
            class="absolute inline-flex h-full w-full animate-ping rounded-full opacity-75"
            :class="wsActive ? 'bg-success' : 'bg-error'"
          ></span>
          <span
            class="relative inline-flex h-2.5 w-2.5 rounded-full"
            :class="wsActive ? 'bg-success' : 'bg-error'"
          ></span>
        </span>
      </div>

      <!-- 核心数字 居中 -->
      <div class="mb-6 text-center">
        <p class="text-base-content text-5xl leading-none font-black tracking-tight tabular-nums" x-text="total">0</p>
        <p class="text-base-content/40 mt-2.5 text-xs">当前在线访客</p>
      </div>

      <!-- 辅助指标 2列 -->
      <div class="mb-5 grid grid-cols-2 gap-3">
        <div class="bg-base-content/[0.04] rounded-2xl px-3 py-3.5 text-center">
          <p class="text-base-content/40 mb-1.5 text-[10px] font-medium">24H 峰值</p>
          <p class="text-base-content text-xl font-extrabold tabular-nums" x-text="peak24h">0</p>
        </div>
        <div class="bg-base-content/[0.04] rounded-2xl px-3 py-3.5 text-center">
          <p class="text-base-content/40 mb-1.5 text-[10px] font-medium">活跃页面</p>
          <p class="text-base-content text-xl font-extrabold tabular-nums" x-text="activePages">0</p>
        </div>
      </div>

      <!-- 热门分布 -->
      <template x-if="showHotPages && hotPages.length > 0">
        <div>
          <p class="text-base-content/40 mb-3 text-xs font-medium">热门分布</p>
          <div class="space-y-1.5">
            <template x-for="(page, index) in hotPages" :key="page.uri">
              <a
                :href="page.viewUrl || page.uri"
                class="group hover:bg-base-content/[0.03] relative flex items-center justify-between overflow-hidden rounded-xl px-3 py-2 transition-colors"
              >
                <!-- 进度条背景 -->
                <div
                  class="bg-primary/[0.06] absolute inset-y-0 left-0 rounded-xl transition-all duration-500"
                  :style="`width: ${Math.min(100, (page.count / hotPages[0].count) * 100)}%`"
                ></div>
                <!-- 内容 -->
                <span
                  class="text-base-content/60 group-hover:text-base-content relative truncate pr-3 text-xs transition-colors"
                  x-text="page.title || page.uri"
                ></span>
                <span
                  class="text-base-content/70 relative shrink-0 text-xs font-bold tabular-nums"
                  x-text="page.count"
                ></span>
              </a>
            </template>
          </div>
        </div>
      </template>

      <!-- 底部更新时间 -->
      <div class="mt-4 text-center" x-show="updatedAt">
        <span class="text-base-content/25 text-[10px] tabular-nums" x-text="'更新于 ' + updatedAt"></span>
      </div>
    </div>
  </div>
</html>
