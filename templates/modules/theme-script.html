<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  <!-- ========================================== -->
  <!--          主题切换内联脚本（防闪烁）          -->
  <!-- ========================================== -->

  <!--
  此脚本必须在 <head> 中尽早执行，在页面渲染前应用主题
  避免页面加载时的主题闪烁问题
  
  优先级逻辑：
  1. 如果前端开关开启 && localStorage 有缓存 → 使用缓存主题
  2. 否则 → 使用默认配置主题
-->
  <script th:fragment="inline-script" th:inline="javascript">
    (function () {
      // === 主题初始化 ===
      const showThemeToggle = /*[[${theme.config.nav.theme_settings.show_theme_toggle}]]*/ true;
      const savedTheme = localStorage.getItem("theme-mode");
      const defaultTheme = /*[[${theme.config.nav.theme_settings.default_theme}]]*/ "dark_theme";
      const lightTheme = /*[[${theme.config.nav.theme_settings.light_theme}]]*/ "light";
      const darkTheme = /*[[${theme.config.nav.theme_settings.dark_theme}]]*/ "dark";

      // === 注入环境变量 ===
      // 配置迁移顺序：新开发者模式 → 旧全局 Debug → 最早期天气 Debug。
      // 这样旧配置中显式关闭 enable_global_debug 时，不会被仍开启的天气 Debug 误打开全局日志。
      const developerMode = /*[[${theme.config.general.debug_settings.enable_developer_mode ?: theme.config.general.debug_settings.enable_global_debug ?: theme.config.general.debug_settings.enable_weather_debug ?: false}]]*/ false;
      const weatherDebug = /*[[${theme.config.general.debug_settings.enable_weather_debug ?: false}]]*/ false;
      window.SYS_GLOBAL_DEBUG = developerMode === true;
      window.SYS_WEATHER_DEBUG = window.SYS_GLOBAL_DEBUG && weatherDebug === true;

      // 主题统一诊断出口。关闭开发者模式时全部为 no-op；开启时过滤敏感键、原始 DOM 和深层对象。
      const sensitiveKeyPattern = /(authorization|cookie|password|secret|token|csrf|pat|session|city|location|address|email|phone|content|body|html|payload|file|query|search|hash|rawdata)/i;
      const sanitizeDebugString = function (value) {
        const withoutUrlDetails = String(value).replace(/https?:\/\/[^\s]+/gi, function (candidate) {
          try {
            const url = new URL(candidate);
            return url.origin + url.pathname;
          } catch {
            return "[url]";
          }
        });
        return withoutUrlDetails.length > 300 ? withoutUrlDetails.slice(0, 300) + "…" : withoutUrlDetails;
      };
      const sanitizeDebugValue = function (value, key, depth) {
        if (sensitiveKeyPattern.test(String(key || ""))) return "[redacted]";
        if (typeof value === "string") return sanitizeDebugString(value);
        if (value == null || typeof value === "number" || typeof value === "boolean") return value;
        if (value instanceof Error) return { name: value.name, message: sanitizeDebugString(value.message) };
        if (value instanceof URL) return value.pathname;
        if (typeof Element !== "undefined" && value instanceof Element) {
          return "<" + value.tagName.toLowerCase() + (value.id ? "#" + value.id : "") + ">";
        }
        if (depth >= 2) return "[object]";
        if (Array.isArray(value)) {
          return value.slice(0, 20).map(function (item) {
            return sanitizeDebugValue(item, "", depth + 1);
          });
        }
        if (typeof value === "object") {
          const result = {};
          Object.entries(value)
            .slice(0, 30)
            .forEach(function (entry) {
              result[entry[0]] = sanitizeDebugValue(entry[1], entry[0], depth + 1);
            });
          return result;
        }
        return String(value);
      };
      const writeDebug = function (level, scope, args) {
        if (!window.SYS_GLOBAL_DEBUG) return;
        const method = typeof console[level] === "function" ? level : "log";
        const safeArgs = Array.from(args || []).map(function (value) {
          return sanitizeDebugValue(value, "", 0);
        });
        console[method]("[SkyDebug:" + String(scope || "theme") + "]", ...safeArgs);
      };
      window.SkyDebug = {
        enabled: function () {
          return window.SYS_GLOBAL_DEBUG === true;
        },
        log: function (scope) {
          writeDebug("log", scope, Array.prototype.slice.call(arguments, 1));
        },
        warn: function (scope) {
          writeDebug("warn", scope, Array.prototype.slice.call(arguments, 1));
        },
        error: function (scope) {
          writeDebug("error", scope, Array.prototype.slice.call(arguments, 1));
        },
        event: function (scope, name, detail) {
          writeDebug("log", scope, [name, detail || {}]);
        },
      };

      // === PJAX 开关 ===
      // 音乐播放器开启时强制启用 PJAX（续播依赖），否则读后台配置
      const musicEnabled = /*[[${theme.config.music?.music_settings?.enable == true}]]*/ false;
      const pjaxSetting = /*[[${theme.config.music?.music_settings?.enable_pjax != false}]]*/ true;
      window.__skyPjaxEnabled = musicEnabled || pjaxSetting;

      // === PJAX 脚本生命周期工具 ===
      // 暴露给后台注入脚本使用：
      // - SkyPjax.once(key, fn): 全站只执行一次，适合点击特效、统计、播放器等全局脚本
      // - SkyPjax.onPage(fn): 首屏和每次 PJAX 后执行，适合当前页面 DOM 初始化
      // - SkyPjax.onCleanup(fn): PJAX 离开当前页前执行，适合清理监听器/定时器
      const pjaxState = window.__skyPjaxState || {
        onceKeys: new Set(),
        pageCallbacks: new Set(),
        cleanupCallbacks: new Set(),
        currentPage: null,
      };
      window.__skyPjaxState = pjaxState;

      const safeRun = function (fn, label) {
        try {
          const result = fn();
          if (result && typeof result.catch === "function") {
            return result.catch(function (error) {
              window.SkyDebug.error("pjax", label + " failed", error);
            });
          }
          return result;
        } catch (error) {
          window.SkyDebug.error("pjax", label + " failed", error);
        }
      };

      window.SkyPjax = window.SkyPjax || {
        once(key, fn) {
          if (!key || typeof fn !== "function") return false;
          const cacheKey = String(key);
          if (pjaxState.onceKeys.has(cacheKey)) return false;
          pjaxState.onceKeys.add(cacheKey);
          safeRun(fn, "once(" + cacheKey + ")");
          return true;
        },
        onPage(fn, options) {
          if (typeof fn !== "function") return function () {};
          const opts = options || {};
          pjaxState.pageCallbacks.add(fn);
          if (opts.immediate !== false && pjaxState.currentPage) {
            safeRun(function () {
              fn(pjaxState.currentPage);
            }, "onPage");
          }
          return function () {
            pjaxState.pageCallbacks.delete(fn);
          };
        },
        onCleanup(fn) {
          if (typeof fn !== "function") return function () {};
          pjaxState.cleanupCallbacks.add(fn);
          return function () {
            pjaxState.cleanupCallbacks.delete(fn);
          };
        },
        _runPage(detail) {
          const pageDetail = detail || {};
          pjaxState.currentPage = pageDetail;
          pjaxState.pageCallbacks.forEach(function (fn) {
            safeRun(function () {
              fn(pageDetail);
            }, "page callback");
          });
          document.dispatchEvent(new CustomEvent("sky:page-load", { detail: pageDetail }));
        },
        _cleanup(detail) {
          const cleanupDetail = detail || {};
          pjaxState.cleanupCallbacks.forEach(function (fn) {
            safeRun(function () {
              fn(cleanupDetail);
            }, "cleanup callback");
          });
          document.dispatchEvent(new CustomEvent("sky:page-cleanup", { detail: cleanupDetail }));
        },
      };

      // === 解析系统主题偏好 ===
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)");

      // 计算当前是否为暗色模式
      // 优先级：localStorage > 默认配置，auto 模式跟随系统
      function resolveIsDark() {
        const effectiveMode = showThemeToggle && savedTheme ? savedTheme : defaultTheme;
        if (effectiveMode === "auto") {
          return prefersDark.matches;
        }
        return effectiveMode === "dark_theme";
      }

      const isDark = resolveIsDark();
      const themeName = isDark ? darkTheme : lightTheme;
      const themeMode = isDark ? "dark" : "light";

      document.documentElement.setAttribute("data-theme", themeName);
      document.documentElement.setAttribute("data-color-scheme", themeMode);

      function handleSystemThemeChange(e) {
        var currentMode =
          showThemeToggle && localStorage.getItem("theme-mode") ? localStorage.getItem("theme-mode") : defaultTheme;
        if (currentMode !== "auto") return;
        var newIsDark = e.matches;
        var newThemeName = newIsDark ? darkTheme : lightTheme;
        var newThemeMode = newIsDark ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", newThemeName);
        document.documentElement.setAttribute("data-color-scheme", newThemeMode);
      }

      // 监听系统主题变化（仅在 auto 模式下响应）
      if (typeof prefersDark.addEventListener === "function") {
        prefersDark.addEventListener("change", handleSystemThemeChange);
      } else if (typeof prefersDark.addListener === "function") {
        prefersDark.addListener(handleSystemThemeChange);
      }

      // === 全局字体按需加载 ===
      const bodyFont = /*[[${theme.config.general.font_settings.body_font}]]*/ "font-default";
      const fontCdn = /*[[${theme.config.general.font_settings.font_cdn}]]*/ "https://cdn.5ee.net/fonts";

      // 加载字体文件
      if (bodyFont === "font-lxgw-wenkai-bright") {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = fontCdn + "/LXGWBright-SemiLight/result.css";
        document.head.appendChild(link);
      } else if (bodyFont === "font-siyuan-songti") {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = fontCdn + "/思源屏显臻宋/result.css";
        document.head.appendChild(link);
      }

      // 应用字体类到 html 元素（全局生效）
      if (bodyFont && bodyFont !== "font-default") {
        document.documentElement.classList.add(bodyFont);
      }
    })();
  </script>
</html>
