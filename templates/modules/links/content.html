<!doctype html>
<html xmlns:th="https://www.thymeleaf.org">
  <!-- ========================================== -->
  <!--        友情链接页主体内容 - Apple Style     -->
  <!-- 支持分组展示，毛玻璃卡片布局                -->
  <!-- 兼容基线：PluginLinks v2.0.0；页面路由直接消费 groups，不手动拼 LinkGroup/Link；link-submit 不可用时切换评论留言兜底。 -->
  <!-- ========================================== -->

  <!-- 友链内容片段 -->
  <main
    class="relative"
    data-links-page
    th:fragment="links-content"
    th:with="rootCfg = ${theme.config.links_settings},
           cfg = ${rootCfg.basic_info},
           hasLinkSubmitPlugin = ${pluginFinder.available('link-submit', '>=1.0.7')},
           sidebarCfg = ${rootCfg.sidebar_settings},
           globalSidebarCfg = ${theme.config.general.sidebar_settings},
           useCustomSidebar = ${sidebarCfg?.enable_custom_sidebar == true},
           sidebarPosition = ${useCustomSidebar ? (sidebarCfg?.sidebar_position ?: 'right') : (globalSidebarCfg?.position ?: 'right')}"
  >
    <div class="mx-auto max-w-7xl px-4 py-8">
      <div class="flex gap-8" th:classappend="${sidebarPosition == 'left'} ? 'flex-row-reverse' : ''">
        <!-- 主内容区 -->
        <section class="min-w-0 flex-1" th:classappend="${sidebarCfg?.show_sidebar != true ? 'max-w-5xl mx-auto' : ''}">
          <!-- 页面标题区 - Apple风格左对齐 -->
          <header class="mb-10">
            <div class="flex items-center justify-between">
              <div>
                <h1
                  class="text-base-content text-2xl font-bold tracking-tight md:text-3xl"
                  th:text="${cfg?.page_title ?: '友情链接'}"
                >
                  友情链接
                </h1>
                <p class="text-base-content/50 mt-1" th:text="${cfg?.page_description ?: '感谢这些优秀的网站与博客'}">
                  感谢这些优秀的网站与博客
                </p>
              </div>
            </div>
          </header>

          <!-- PluginLinks 2.0.0 官方 group 路由：simpleGroups 生成筛选，links 承载当前分组结果。 -->
          <nav
            class="mb-8 flex gap-2 overflow-x-auto pb-2"
            aria-label="友链分组"
            data-link-group-navigation
            th:if="${simpleGroups != null and !#lists.isEmpty(simpleGroups)}"
          >
            <a
              th:href="@{/links}"
              data-link-group-filter="all"
              th:attr="aria-current=${#strings.isEmpty(group) ? 'page' : null}"
              th:classappend="${#strings.isEmpty(group) ? 'bg-primary text-primary-content border-primary' : ''}"
              class="btn btn-sm border-base-content/10 shrink-0 rounded-full"
            >
              全部
            </a>
            <a
              th:each="groupOption : ${simpleGroups}"
              th:href="@{/links(group=${groupOption.metadata.name})}"
              th:text="${groupOption.spec.displayName ?: '未命名分组'}"
              th:data-link-group-filter="${groupOption.metadata.name}"
              th:attr="aria-current=${group == groupOption.metadata.name ? 'page' : null}"
              th:classappend="${group == groupOption.metadata.name ? 'bg-primary text-primary-content border-primary' : ''}"
              class="btn btn-sm border-base-content/10 shrink-0 rounded-full"
            >
              分组
            </a>
          </nav>

          <!-- 分组展示。循环变量不得命名为 group，否则会遮蔽路由注入的 group 字符串。 -->
          <div
            class="space-y-10"
            data-link-groups
            th:if="${#strings.isEmpty(group) ? (groups != null and !#lists.isEmpty(groups)) : (links != null and !#lists.isEmpty(links))}"
          >
            <th:block th:each="linkGroup : ${groups}">
              <!-- 分组区块 -->
              <section
                class="link-group"
                th:if="${#strings.isEmpty(group) or linkGroup.metadata.name == group}"
                th:with="displayLinks=${#strings.isEmpty(group) ? linkGroup.links : links}"
                th:data-link-group-section="${linkGroup.metadata.name}"
              >
                <!-- 分组标题 -->
                <div class="mb-5 flex items-center gap-3">
                  <div
                    class="from-primary/20 to-primary/10 flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br"
                  >
                    <span class="icon-[heroicons--folder] text-primary h-4 w-4"></span>
                  </div>
                  <h2
                    class="text-base-content text-lg font-semibold"
                    th:text="${linkGroup.spec.displayName ?: '未分组'}"
                  >
                    分组名称
                  </h2>
                  <span
                    class="text-base-content/40 bg-base-200/60 rounded-full px-2 py-0.5 text-xs"
                    th:text="${displayLinks == null ? 0 : #lists.size(displayLinks)}"
                  ></span>
                </div>

                <!-- 链接卡片网格 - Apple Bento风格 -->
                <div
                  class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-3"
                  th:if="${displayLinks != null and !#lists.isEmpty(displayLinks)}"
                >
                  <a
                    th:each="link : ${displayLinks}"
                    th:href="${link.spec.url}"
                    target="_blank"
                    rel="noopener noreferrer"
                    class="glow-card group bg-base-100/80 border-base-content/[0.06] hover:border-base-content/10 relative flex cursor-pointer items-center gap-4 rounded-2xl border p-4 shadow-sm backdrop-blur-xl transition-all duration-300 ease-out hover:scale-[1.02] hover:shadow-lg"
                  >
                    <!-- Logo -->
                    <div
                      class="bg-base-200/60 ring-base-content/5 group-hover:ring-primary/30 flex h-12 w-12 shrink-0 items-center justify-center overflow-hidden rounded-xl ring-1 transition-all"
                    >
                      <img
                        th:if="${link.spec.logo != null and !link.spec.logo.isEmpty()}"
                        th:src="${link.spec.logo}"
                        th:alt="${link.spec.displayName}"
                        class="h-full w-full object-cover"
                        loading="lazy"
                        onerror="
                          this.style.display = 'none';
                          this.nextElementSibling.style.display = 'flex';
                        "
                      />
                      <span
                        class="icon-[heroicons--globe-alt] text-base-content/30 h-6 w-6"
                        th:style="${link.spec.logo != null and !link.spec.logo.isEmpty() ? 'display:none' : ''}"
                      ></span>
                    </div>

                    <!-- 信息 -->
                    <div class="min-w-0 flex-1">
                      <h3
                        class="text-base-content group-hover:text-primary mb-0.5 line-clamp-1 text-sm font-medium transition-colors"
                        th:text="${link.spec.displayName}"
                      >
                        网站名称
                      </h3>
                      <p
                        class="text-base-content/50 line-clamp-1 text-xs"
                        th:text="${link.spec.description ?: '暂无描述'}"
                      >
                        网站描述
                      </p>
                    </div>

                    <!-- 外链图标 -->
                    <div class="shrink-0">
                      <span
                        class="icon-[heroicons--arrow-right] text-base-content/20 group-hover:text-primary h-4 w-4 transition-all duration-300 group-hover:translate-x-1"
                      ></span>
                    </div>
                  </a>
                </div>
                <p
                  class="text-base-content/50 rounded-2xl border border-dashed py-8 text-center text-sm"
                  th:if="${displayLinks == null or #lists.isEmpty(displayLinks)}"
                >
                  该分组暂无友情链接
                </p>
              </section>
            </th:block>
          </div>

          <!-- 无友链提示 -->
          <div
            th:if="${#strings.isEmpty(group) ? (groups == null or #lists.isEmpty(groups)) : (links == null or #lists.isEmpty(links))}"
            data-links-empty
            class="bg-base-100/60 border-base-content/5 rounded-2xl border backdrop-blur-xl"
          >
            <div class="flex flex-col items-center justify-center py-20">
              <div class="bg-base-200/60 mb-4 flex h-16 w-16 items-center justify-center rounded-2xl">
                <span class="icon-[heroicons--link-slash] text-base-content/30 h-8 w-8"></span>
              </div>
              <p
                class="text-base-content/50"
                th:text="${#strings.isEmpty(group) ? '暂无友情链接' : '该分组不存在或暂无友情链接'}"
              >
                暂无友情链接
              </p>
            </div>
          </div>

          <!-- Link Exchange CTA Card (Compact & Interactive) -->
          <!-- Link Exchange Area: Card + Modals -->
          <div class="mt-8" th:if="${rootCfg?.apply_settings?.enable == true}">
            <!-- 1. Apply Card (Compact Row Layout) -->
            <div
              class="glow-card bg-base-100/80 border-base-content/[0.06] flex flex-col items-center justify-between gap-6 rounded-2xl border p-6 backdrop-blur-xl md:flex-row"
            >
              <!-- Left: Text -->
              <div class="min-w-0 flex-1 text-center md:text-left">
                <div class="mb-1 flex items-center justify-center gap-3 md:justify-start">
                  <div class="bg-primary/10 text-primary flex h-8 w-8 shrink-0 items-center justify-center rounded-lg">
                    <span class="icon-[heroicons--paper-airplane] h-4 w-4"></span>
                  </div>
                  <h3
                    class="text-base-content text-lg font-bold"
                    th:text="${!#strings.isEmpty(rootCfg.apply_settings.apply_title) ? rootCfg.apply_settings.apply_title : '加入友链星球'}"
                  >
                    加入友链星球
                  </h3>
                </div>
                <p
                  class="text-base-content/60 pl-0 text-sm md:pl-11"
                  th:text="${!#strings.isEmpty(rootCfg.apply_settings.apply_description) ? rootCfg.apply_settings.apply_description : '与我交换友链，一起探索更广阔的创作世界'}"
                >
                  与我交换友链，一起探索更广阔的创作世界
                </p>
              </div>

              <!-- Right: Actions -->
              <div class="flex shrink-0 items-center gap-3">
                <!-- View Info Button (First) -->
                <button
                  onclick="document.getElementById('site-info-modal').showModal()"
                  class="btn btn-ghost btn-sm md:btn-md bg-base-200/50 hover:bg-base-200 text-base-content rounded-xl font-bold transition-all"
                >
                  <span class="icon-[heroicons--information-circle] h-4 w-4"></span>
                  <span class="hidden sm:inline">本站信息</span>
                  <span class="sm:hidden">信息</span>
                </button>

                <!-- Apply Button (Second/Right - Primary) -->
                <button
                  th:if="${hasLinkSubmitPlugin}"
                  type="button"
                  data-link-submit-trigger
                  data-link-submit-script="/plugins/link-submit/assets/static/link-submit-widget.iife.js?version=1.0.7"
                  data-link-submit-style="/plugins/link-submit/assets/static/var.css?version=1.0.7"
                  aria-describedby="link-submit-runtime-status"
                  class="btn btn-primary btn-sm md:btn-md shadow-primary/20 hover:shadow-primary/30 rounded-xl font-bold shadow-lg transition-all"
                >
                  <span class="icon-[heroicons--plus] h-4 w-4"></span>
                  <span class="hidden sm:inline">立即申请</span>
                  <span class="sm:hidden">申请</span>
                </button>
                <!-- 插件不可用或官方组件资源加载失败时，使用站点自己的申请渠道。 -->
                <th:block th:with="applyUrl=${#strings.trim(rootCfg.apply_settings.apply_url ?: '')}">
                  <a
                    th:if="${!applyUrl.isEmpty() and applyUrl != '#' and applyUrl != '/#'}"
                    th:href="${applyUrl}"
                    th:target="${#strings.startsWith(applyUrl, 'http')} ? '_blank' : null"
                    th:hidden="${hasLinkSubmitPlugin}"
                    data-link-submit-fallback
                    rel="noopener"
                    class="btn btn-primary btn-sm md:btn-md rounded-xl shadow-lg"
                  >
                    <span class="icon-[heroicons--arrow-top-right-on-square] h-4 w-4"></span>
                    前往申请
                  </a>
                  <a
                    th:if="${(applyUrl.isEmpty() or applyUrl == '#' or applyUrl == '/#') and cfg?.enable_comment != false}"
                    href="#links-comments"
                    th:hidden="${hasLinkSubmitPlugin}"
                    data-link-submit-fallback
                    class="btn btn-primary btn-sm md:btn-md rounded-xl shadow-lg"
                  >
                    <span class="icon-[heroicons--chat-bubble-left-right] h-4 w-4"></span>
                    留言申请
                  </a>
                  <a
                    th:if="${(applyUrl.isEmpty() or applyUrl == '#' or applyUrl == '/#') and cfg?.enable_comment == false and !#strings.isEmpty(rootCfg.apply_settings.blogger_email)}"
                    th:href="|mailto:${rootCfg.apply_settings.blogger_email}|"
                    th:hidden="${hasLinkSubmitPlugin}"
                    data-link-submit-fallback
                    class="btn btn-primary btn-sm md:btn-md rounded-xl shadow-lg"
                  >
                    <span class="icon-[heroicons--envelope] h-4 w-4"></span>
                    邮件申请
                  </a>
                  <button
                    th:if="${(applyUrl.isEmpty() or applyUrl == '#' or applyUrl == '/#') and cfg?.enable_comment == false and #strings.isEmpty(rootCfg.apply_settings.blogger_email)}"
                    type="button"
                    th:hidden="${hasLinkSubmitPlugin}"
                    data-link-submit-fallback
                    disabled
                    class="btn btn-disabled btn-sm md:btn-md rounded-xl"
                  >
                    暂未开放申请
                  </button>
                </th:block>
              </div>
            </div>
            <p
              th:if="${hasLinkSubmitPlugin}"
              id="link-submit-runtime-status"
              data-link-submit-status
              role="status"
              aria-live="polite"
              tabindex="-1"
              hidden
              class="text-warning mt-3 text-sm"
            ></p>

            <!-- 2. Site Info Modal (Refined Left-Layout) -->
            <dialog
              id="site-info-modal"
              class="modal modal-bottom sm:modal-middle"
              x-data="{
                 copy(text, $el) {
                     navigator.clipboard.writeText(text).then(() => {
                         const originalIcon = $el.innerHTML;
                         $el.innerHTML = '<span class=\'icon-[heroicons--check] w-4 h-4 text-success\'></span>';
                         setTimeout(() => { $el.innerHTML = originalIcon; }, 2000);
                     });
                 }
             }"
            >
              <div class="modal-box bg-base-100/95 border-base-content/10 max-w-lg border backdrop-blur-2xl">
                <form method="dialog">
                  <button class="btn btn-sm btn-circle btn-ghost absolute top-2 right-2">✕</button>
                </form>

                <h3 class="text-primary mb-6 flex items-center gap-2 text-lg font-bold">
                  <span class="icon-[heroicons--information-circle] h-6 w-6"></span>
                  <span>本站信息</span>
                </h3>

                <div class="space-y-4">
                  <!-- Name -->
                  <div class="border-base-content/5 flex items-center justify-between border-b pb-3">
                    <span class="text-base-content/70 text-sm font-medium">站点名称</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span
                        class="text-base-content truncate text-sm font-bold select-all"
                        th:text="${#strings.isEmpty(rootCfg.apply_settings.blogger_title) ? site.title : rootCfg.apply_settings.blogger_title}"
                        >My Blog</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:data-text="${#strings.isEmpty(rootCfg.apply_settings.blogger_title) ? site.title : rootCfg.apply_settings.blogger_title}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>

                  <!-- URL -->
                  <div class="border-base-content/5 flex items-center justify-between border-b pb-3">
                    <span class="text-base-content/70 text-sm font-medium">网站地址</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span class="text-base-content truncate font-mono text-sm select-all" th:text="${site.url}"
                        >https://example.com</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:data-text="${site.url}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>

                  <!-- Email -->
                  <div
                    class="border-base-content/5 flex items-center justify-between border-b pb-3"
                    th:if="${!#strings.isEmpty(rootCfg.apply_settings.blogger_email)}"
                  >
                    <span class="text-base-content/70 text-sm font-medium">联系邮箱</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span
                        class="text-base-content truncate font-mono text-sm select-all"
                        th:text="${rootCfg.apply_settings.blogger_email}"
                        >admin@example.com</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:data-text="${rootCfg.apply_settings.blogger_email}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>

                  <!-- Description -->
                  <div class="border-base-content/5 flex items-center justify-between border-b pb-3">
                    <span class="text-base-content/70 shrink-0 text-sm font-medium">站点描述</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span
                        class="text-base-content truncate text-sm select-all"
                        th:with="desc=${!#strings.isEmpty(rootCfg.apply_settings.blogger_description) ? rootCfg.apply_settings.blogger_description : ((site.seo != null and !#strings.isEmpty(site.seo.description)) ? site.seo.description : site.subtitle)}"
                        th:text="${desc}"
                        >Site Description...</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:with="desc=${!#strings.isEmpty(rootCfg.apply_settings.blogger_description) ? rootCfg.apply_settings.blogger_description : ((site.seo != null and !#strings.isEmpty(site.seo.description)) ? site.seo.description : site.subtitle)}"
                        th:data-text="${desc}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>

                  <!-- Logo -->
                  <div class="border-base-content/5 flex items-center justify-between border-b pb-3">
                    <span class="text-base-content/70 text-sm font-medium">Logo 地址</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span
                        class="text-base-content/80 truncate font-mono text-xs select-all"
                        th:text="${#strings.isEmpty(rootCfg.apply_settings.blogger_logo) ? site.logo : rootCfg.apply_settings.blogger_logo}"
                        >...</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:data-text="${#strings.isEmpty(rootCfg.apply_settings.blogger_logo) ? site.logo : rootCfg.apply_settings.blogger_logo}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>

                  <!-- RSS -->
                  <div class="flex items-center justify-between">
                    <span class="text-base-content/70 text-sm font-medium">RSS 地址</span>
                    <div class="flex max-w-[70%] items-center gap-2">
                      <span
                        class="text-base-content/80 truncate font-mono text-xs select-all"
                        th:with="rssPath=${!#strings.isEmpty(rootCfg.apply_settings.blogger_rss) ? rootCfg.apply_settings.blogger_rss : '/rss.xml'},
                                      urlStr=${#strings.toString(site.url)},
                                      baseUrl=${urlStr.endsWith('/') ? #strings.substring(urlStr, 0, urlStr.length() - 1) : urlStr},
                                      fullRssUrl=${rssPath.startsWith('http') ? rssPath : baseUrl + rssPath}"
                        th:text="${fullRssUrl}"
                        >.../rss.xml</span
                      >
                      <button
                        class="btn btn-xs btn-ghost btn-square text-primary"
                        th:with="rssPath=${!#strings.isEmpty(rootCfg.apply_settings.blogger_rss) ? rootCfg.apply_settings.blogger_rss : '/rss.xml'},
                                         urlStr=${#strings.toString(site.url)},
                                         baseUrl=${urlStr.endsWith('/') ? #strings.substring(urlStr, 0, urlStr.length() - 1) : urlStr},
                                         fullRssUrl=${rssPath.startsWith('http') ? rssPath : baseUrl + rssPath}"
                        th:data-text="${fullRssUrl}"
                        @click="copy($el.dataset.text, $el)"
                        title="复制"
                      >
                        <span class="icon-[heroicons--document-duplicate] h-4 w-4"></span>
                      </button>
                    </div>
                  </div>
                </div>
              </div>
              <form method="dialog" class="modal-backdrop"><button>close</button></form>
            </dialog>
          </div>

          <!-- 评论区 -->
          <section id="links-comments" class="mt-12" th:if="${cfg?.enable_comment != false}">
            <div class="mb-5 flex items-center gap-3">
              <div
                class="from-primary/20 to-primary/10 flex h-8 w-8 items-center justify-center rounded-xl bg-gradient-to-br"
              >
                <span class="icon-[mdi--comment-text-outline] text-primary h-4 w-4"></span>
              </div>
              <h2 class="text-base-content text-lg font-semibold">评论留言</h2>
            </div>
            <div class="glow-card bg-base-100/80 border-base-content/[0.06] rounded-2xl border p-6 backdrop-blur-xl">
              <halo:comment
                group="plugin.halo.run"
                kind="Plugin"
                th:name="${pluginName != null ? pluginName : 'links'}"
                th:attr="displayName=${cfg?.page_title ?: '友情链接'}, subject-title=${cfg?.page_title ?: '友情链接'}"
                colorScheme="system"
              >
              </halo:comment>
            </div>
          </section>
        </section>

        <!-- 右侧边栏 -->
        <aside
          th:if="${sidebarCfg?.show_sidebar == true}"
          class="sticky top-20 hidden w-80 shrink-0 space-y-6 self-start lg:block"
        >
          <th:block th:replace="~{modules/widgets/sidebar :: dynamic(${sidebarCfg})}" />
        </aside>
      </div>
    </div>
  </main>
</html>
