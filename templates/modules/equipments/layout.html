<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--        装备页面布局                         -->
  <!-- 路由：/equipments                            -->
  <!-- 插件：plugin-equipment              -->
  <!-- ========================================== -->

  <head
    th:with="cfg = ${theme.config.plugins.equipment?.basic_info},
             pageNumber = ${equipments?.page ?: 1},
             pageTitle = ${cfg?.page_title ?: (title ?: '装备')},
             documentTitle = ${pageTitle + (pageNumber > 1 ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title},
             pageCanonical = ${pageNumber > 1 ? '/equipments/page/' + pageNumber : '/equipments'}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防止主题闪烁 -->
    <th:block th:replace="~{modules/theme-script :: head}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${cfg?.page_description}, ${pageCanonical}, ${site.logo}, 'website')}"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="${site.favicon}" />

    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/equipment.css?v={version}(version=${theme.spec.version})}" />


  </head>

  <body
    th:with="bgConfig = ${theme.config.visual.global_background},
               enableCustomBg = ${bgConfig?.enable_custom == true},
               bgStyle = ${bgConfig?.background_style ?: 'base-200'},
               bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域 -->
      <main id="swup" data-page="equipment" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="~{modules/component-settings :: sidebar('equipment', ${content})}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig('equipment', 'basic')}" />
    </div>

    <!-- JavaScript -->

    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
  </body>
</html>
