<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- 分组切换使用插件的 group 路由；首次渲染与翻页均以服务端状态为准。 -->
<th:block th:fragment="navigation(groups, currentGroup, tabStyle)" th:switch="${tabStyle}">
    <th:block th:case="'chips'">
        <th:block th:replace="~{modules/equipments/group-switch :: chips(${groups}, ${currentGroup})}" />
    </th:block>
    <th:block th:case="'underline'">
        <th:block th:replace="~{modules/equipments/group-switch :: underline(${groups}, ${currentGroup})}" />
    </th:block>
    <th:block th:case="'glass'">
        <th:block th:replace="~{modules/equipments/group-switch :: glass(${groups}, ${currentGroup})}" />
    </th:block>
    <th:block th:case="*">
        <th:block th:replace="~{modules/equipments/group-switch :: pills(${groups}, ${currentGroup})}" />
    </th:block>
</th:block>

<div th:fragment="pills(groups, currentGroup)" class="equipment-tabs-pills mb-6">
    <div class="flex flex-wrap items-center gap-2">
        <a th:href="@{/equipments}" th:attr="aria-current=${#strings.isEmpty(currentGroup) ? 'page' : null}"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-medium border transition-all duration-200"
            th:classappend="${#strings.isEmpty(currentGroup)} ? 'bg-base-100 text-base-content shadow-sm border-base-content/10' : 'bg-base-100/60 text-base-content/60 border-base-content/5 hover:bg-base-100 hover:text-base-content hover:shadow-sm hover:border-base-content/10'">
            <span class="icon-[heroicons--squares-2x2] w-3.5 h-3.5"></span>
            <span>全部</span>
        </a>
        <a th:each="group : ${groups}" th:href="@{/equipments(group=${group.metadata.name})}"
            th:attr="aria-current=${currentGroup == group.metadata.name ? 'page' : null}"
            class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-sm font-medium border transition-all duration-200"
            th:classappend="${currentGroup == group.metadata.name} ? 'bg-base-100 text-base-content shadow-sm border-base-content/10' : 'bg-base-100/60 text-base-content/60 border-base-content/5 hover:bg-base-100 hover:text-base-content hover:shadow-sm hover:border-base-content/10'">
            <span th:if="${#annotations.get(group, 'icon') != null}" class="group-icon w-3.5 h-3.5" th:utext="${#annotations.get(group, 'icon')}"></span>
            <span th:unless="${#annotations.get(group, 'icon') != null}" class="icon-[heroicons--folder] w-3.5 h-3.5 opacity-50"></span>
            <span th:text="${group.spec.displayName}"></span>
            <span class="text-xs opacity-50" th:text="${group.status.equipmentCount}"></span>
        </a>
    </div>
</div>

<div th:fragment="chips(groups, currentGroup)" class="equipment-tabs-chips mb-6">
    <div class="flex flex-wrap justify-center gap-2">
        <a th:href="@{/equipments}" th:attr="aria-current=${#strings.isEmpty(currentGroup) ? 'page' : null}"
            class="inline-flex items-center gap-2 h-9 px-4 rounded-lg text-sm font-medium border transition-all duration-200"
            th:classappend="${#strings.isEmpty(currentGroup)} ? 'bg-primary/10 text-primary border-primary/30' : 'bg-base-100 text-base-content/60 border-base-content/10 hover:border-primary/30 hover:text-primary'">
            <span class="icon-[heroicons--squares-2x2] w-4 h-4"></span>
            <span>全部</span>
        </a>
        <a th:each="group : ${groups}" th:href="@{/equipments(group=${group.metadata.name})}"
            th:attr="aria-current=${currentGroup == group.metadata.name ? 'page' : null}"
            class="inline-flex items-center gap-1.5 h-9 px-4 rounded-lg text-sm font-medium border transition-all duration-200"
            th:classappend="${currentGroup == group.metadata.name} ? 'bg-primary/10 text-primary border-primary/30' : 'bg-base-100 text-base-content/60 border-base-content/10 hover:border-primary/30 hover:text-primary'">
            <span th:if="${#annotations.get(group, 'icon') != null}" class="group-icon w-4 h-4" th:utext="${#annotations.get(group, 'icon')}"></span>
            <span th:unless="${#annotations.get(group, 'icon') != null}" class="icon-[heroicons--folder] w-4 h-4 opacity-50"></span>
            <span th:text="${group.spec.displayName}"></span>
            <span class="text-xs opacity-50" th:text="'(' + ${group.status.equipmentCount} + ')'"></span>
        </a>
    </div>
</div>

<div th:fragment="underline(groups, currentGroup)" class="equipment-tabs-underline mb-6">
    <div class="flex flex-wrap justify-center items-center gap-x-1 gap-y-0 border-b border-base-content/10 pb-px">
        <a th:href="@{/equipments}" th:attr="aria-current=${#strings.isEmpty(currentGroup) ? 'page' : null}"
            class="relative px-3 py-2.5 text-sm font-medium transition-colors duration-200"
            th:classappend="${#strings.isEmpty(currentGroup)} ? 'text-primary' : 'text-base-content/50 hover:text-base-content'">
            <span>全部</span>
            <span th:if="${#strings.isEmpty(currentGroup)}" class="absolute bottom-0 left-1 right-1 h-0.5 bg-primary rounded-full"></span>
        </a>
        <a th:each="group : ${groups}" th:href="@{/equipments(group=${group.metadata.name})}"
            th:attr="aria-current=${currentGroup == group.metadata.name ? 'page' : null}"
            class="relative px-3 py-2.5 text-sm font-medium transition-colors duration-200"
            th:classappend="${currentGroup == group.metadata.name} ? 'text-primary' : 'text-base-content/50 hover:text-base-content'">
            <span th:text="${group.spec.displayName}"></span>
            <sup class="ml-0.5 text-xs opacity-40" th:text="${group.status.equipmentCount}"></sup>
            <span th:if="${currentGroup == group.metadata.name}" class="absolute bottom-0 left-1 right-1 h-0.5 bg-primary rounded-full"></span>
        </a>
    </div>
</div>

<div th:fragment="glass(groups, currentGroup)" class="equipment-tabs-glass mb-6">
    <div class="flex flex-wrap justify-center gap-2 p-3 rounded-2xl bg-base-200/40 backdrop-blur-sm dark:bg-base-300/30">
        <a th:href="@{/equipments}" th:attr="aria-current=${#strings.isEmpty(currentGroup) ? 'page' : null}"
            class="px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200"
            th:classappend="${#strings.isEmpty(currentGroup)} ? 'bg-base-100 text-base-content shadow-sm dark:bg-base-100/90' : 'text-base-content/50 hover:text-base-content hover:bg-base-100/60'">
            全部
        </a>
        <a th:each="group : ${groups}" th:href="@{/equipments(group=${group.metadata.name})}"
            th:attr="aria-current=${currentGroup == group.metadata.name ? 'page' : null}"
            class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl text-sm font-medium transition-all duration-200"
            th:classappend="${currentGroup == group.metadata.name} ? 'bg-base-100 text-base-content shadow-sm dark:bg-base-100/90' : 'text-base-content/50 hover:text-base-content hover:bg-base-100/60'">
            <span th:text="${group.spec.displayName}"></span>
            <span class="px-1.5 py-0.5 rounded-md text-xs bg-base-content/10" th:text="${group.status.equipmentCount}"></span>
        </a>
    </div>
</div>

</html>
