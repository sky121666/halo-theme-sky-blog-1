<th:block
  xmlns:th="https://www.thymeleaf.org"
  th:fragment="styles"
  th:if="${pluginFinder.available('plugin-ncm')}"
  th:with="ncm=${theme.config?.plugins?.ncm}, ncmColorSource=${ncm?.color_source ?: 'theme'}"
>
  <style
    th:if="${ncmColorSource == 'theme' or ncmColorSource == 'custom'}"
    th:with="light=${#strings.toString(ncm?.light_custom_color)}, dark=${#strings.toString(ncm?.dark_custom_color)}"
    th:inline="css"
    data-sky-ncm-accent
  >
    [# th:if="${ncmColorSource == 'theme'}"]
    ncm-mini-player {
      --ncm-player-accent: var(--color-primary);
    }
    [/]
    [# th:if="${ncmColorSource == 'custom' and light != null and light.matches('#[0-9a-fA-F]{6}')}"]
    :root[data-color-scheme="light"] ncm-mini-player {
      --ncm-player-accent: [(${light})];
    }
    [/]
    [# th:if="${ncmColorSource == 'custom' and dark != null and dark.matches('#[0-9a-fA-F]{6}')}"]
    :root[data-color-scheme="dark"] ncm-mini-player {
      --ncm-player-accent: [(${dark})];
    }
    [/]
  </style>

  <style data-sky-ncm-glass>
    /* 网抑云负责折射与实体回退，主题为展开面板提供玻璃底色。 */
    @supports (color: color-mix(in oklab, white, transparent)) {
      ncm-mini-player {
        --sky-ncm-glass-color: color-mix(in oklab, var(--color-base-100, white) 76%, white);
        --sky-ncm-glass-opacity: 66%;
        --ncm-player-glass-tint: color-mix(in oklab, var(--sky-ncm-glass-color) var(--sky-ncm-glass-opacity), transparent);
      }

      :where(:root[data-color-scheme="dark"]) ncm-mini-player {
        --sky-ncm-glass-color: color-mix(in oklab, var(--color-base-100, #141820) 85%, black);
        --sky-ncm-glass-opacity: 64%;
      }

      @media (prefers-contrast: more) {
        ncm-mini-player {
          --sky-ncm-glass-opacity: 84%;
        }
      }
    }
  </style>
</th:block>
