<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)"
  th:attr="data-site-url=${site.url != null ? site.url.toString() : null}">
  <!-- ========================================== -->
  <!--        图库页面布局                         -->
  <!-- 自定义模板：page_photos.html                -->
  <!-- ========================================== -->

  <head
    th:with="isDetail=${_templateId == 'photo'},
             pageNumber=${photos?.page ?: 1},
             pageTitle=${isDetail ? (photo?.spec?.displayName ?: '照片详情') : (theme.config.plugins.photos?.page_title ?: (title ?: '图库'))},
             documentTitle=${pageTitle + (!isDetail and pageNumber > 1 ? ' - 第 ' + pageNumber + ' 页' : '') + ' - ' + site.title},
             pageCanonical=${isDetail ? photo?.permalink : (pageNumber > 1 ? '/photos?page=' + pageNumber : '/photos')},
             pageDescription=${isDetail ? photo?.spec?.description : theme.config.plugins.photos?.page_description},
             pageImage=${isDetail and photo?.spec?.url != null ? photo.spec.url : site.logo}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防止主题闪烁 -->
    <th:block th:replace="~{modules/theme-script :: head}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${pageDescription}, ${pageCanonical}, ${pageImage}, ${isDetail ? 'article' : 'website'})}"
    />

    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/photos.css?v={version}(version=${theme.spec.version})}" />

  </head>

  <body
    th:with="bgConfig = ${theme.config.visual.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'},
                 collectionPage = ${photos?.page ?: 1},
                 collectionPages = ${photos?.totalPages ?: 0},
                 collectionSize = ${param.size != null and !#lists.isEmpty(param.size) ? param.size[0] : null}"
    th:class="'min-h-screen text-base-content ' + ${bgClass} + ' relative'"
  >
    <div class="relative z-10">

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域 -->
      <main id="swup" data-page="photos" class="mt-6 flex-1 md:mt-8"
        th:attr="data-collection-base=${photos != null ? '/photos' : null},data-collection-mode=${photos != null ? 'photos' : null},data-collection-page=${collectionPage},data-collection-total-pages=${collectionPages},data-collection-size=${collectionSize}">
        <th:block th:replace="${content}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig('photos', 'comment')}" />
    </div>

    <!-- JavaScript -->

    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
  </body>
</html>
