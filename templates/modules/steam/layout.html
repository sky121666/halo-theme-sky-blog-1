<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- ========================================== -->
  <!--        Steam 游戏库页面布局                 -->
  <!-- 路由：/steam                               -->
  <!-- 插件：plugin-steam                         -->
  <!-- ========================================== -->

  <head
    th:with="pageTitle=${title ?: 'Steam 游戏库'},
             documentTitle=${pageTitle + ' - ' + site.title}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 启用 View Transitions API (Safari 18+/Chrome 111+) -->
    <meta name="view-transition" content="same-origin" />

    <!-- 防止主题闪烁 -->
    <th:block th:replace="~{modules/theme-script :: inline-script}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${null}, '/steam', ${site.logo}, 'website')}"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" th:href="${site.favicon}" />

    <!-- 字体 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/steam.css?v={version}(version=${theme.spec.version})}" />
    <!-- 音乐播放器 CSS -->
    <th:block th:replace="~{modules/music-player :: head}" />
  </head>

  <body
    th:with="bgConfig = ${theme.config.general.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >
    <div class="relative z-10">
      <!-- 加载屏幕 -->
      <th:block th:replace="~{modules/loading-screen :: loading-screen}" />

      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- 主要内容区域 -->
      <main id="swup" class="mt-6 flex-1 md:mt-8">
        <th:block th:replace="${content}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <!-- 页面专属 Alpine 状态必须跟随 PJAX extras 容器进入和离开。 -->
      <div
        x-data="{ gameBg: null }"
        x-init="(async () => { for (const url of ['/apis/api.steam.timxs.com/v1alpha1/profile', '/apis/api.steam.halo.run/v1alpha1/profile']) { try { const r = await fetch(url); if (!r.ok) continue; const d = await r.json(); const gameId = d.summary?.gameId || d.summary?.gameid; if (d.playing && gameId) gameBg = gameId; break; } catch {} } })()"
      >
        <div x-show="gameBg" x-cloak class="steam-game-bg pointer-events-none fixed inset-0 z-0">
          <img
            x-bind:src="gameBg ? 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + gameBg + '/library_hero.jpg' : null"
            alt=""
            aria-hidden="true"
            class="h-full w-full object-cover opacity-20"
            @error="if(gameBg) $el.src = 'https://cdn.cloudflare.steamstatic.com/steam/apps/' + gameBg + '/header.jpg'"
          />
          <div class="via-base-100/80 to-base-100 absolute inset-0 bg-gradient-to-b from-transparent"></div>
        </div>
      </div>
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />

      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dock}" />
    </div>

    <!-- JavaScript -->
    <div id="swup-scripts" hidden>
      <script
        type="module"
        th:src="@{/assets/js/steam.js?v={version}(version=${theme.spec.version})}"
        data-swup-reload-script
      ></script>
    </div>
    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
    <!-- 悬浮音乐播放器 -->
    <th:block th:replace="~{modules/music-player :: player}" />
  </body>
</html>
