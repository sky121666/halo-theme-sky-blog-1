<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<!-- ========================================== -->
<!--              Logo 渲染组件                  -->
<!-- ========================================== -->

<!--
  参数说明：
  - sizeClass: Logo 图标的尺寸类（如 'w-8 h-8' 或 'w-6 h-6'）
  
  logo_type 可选值：
  - none: 不显示图标
  - system: 默认读取 Halo 站点 Logo
  - iconify: 显示图标库图标
  - svg: 显示 SVG 代码
  - image: 显示上传的图片
-->

<!-- Logo 图标渲染片段 -->
<span th:fragment="icon(sizeClass)"
  th:with="logo=${theme.config?.get('components')?.get('nav')?.get('logo_settings')},
           logoType=${logo?.logo_type ?: 'system'},
           logoTitle=${#strings.isEmpty(logo?.custom_logo_title) ? site.title : logo.custom_logo_title}">
  <!-- 系统设置类型 -->
  <img th:if="${logoType == 'system' && !#strings.isEmpty(site.logo)}"
    th:src="${site.logo}"
    th:alt="${logoTitle}"
    th:class="${sizeClass} + ' object-contain'" />

  <!-- Iconify 图标选择器类型 - 兼容两种数据格式 -->
  <!-- 对象格式：不是以 <svg 开头 -->
  <span
    th:if="${logoType == 'iconify' and logo.logo_icon != null and !logo.logo_icon.toString().startsWith('<svg')}"
    th:utext="${logo.logo_icon['value']}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>
  <!-- 字符串格式：以 <svg 开头 -->
  <span
    th:if="${logoType == 'iconify' and logo.logo_icon != null and logo.logo_icon.toString().startsWith('<svg')}"
    th:utext="${logo.logo_icon}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>

  <!-- SVG 代码类型 -->
  <span th:if="${logoType == 'svg'}"
    th:utext="${logo.logo_icon_html}"
    th:class="${sizeClass} + ' text-primary flex items-center justify-center'">
  </span>

  <!-- 图片类型 -->
  <img
    th:if="${logoType == 'image' && !#strings.isEmpty(logo.logo_image)}"
    th:src="${logo.logo_image}"
    th:alt="${logoTitle}"
    th:class="${sizeClass} + ' object-contain'" />
</span>

<!-- Logo 标题渲染片段 -->
<span th:fragment="title" th:with="logo=${theme.config?.get('components')?.get('nav')?.get('logo_settings')}"
  th:if="${theme.config?.get('components')?.get('nav')?.get('logo_settings')?.get('show_logo_title')?.toString() != 'false'}"
  th:text="${#strings.isEmpty(logo?.custom_logo_title) ? site.title : logo.custom_logo_title}">
</span>

</html>
