<!doctype html>
<html th:lang="${#locale.toLanguageTag}" th:fragment="html (content)">
  <!-- 页面头部 -->

  <head
    th:with="documentTitle=${site.subtitle != null and !#strings.isEmpty(site.subtitle) ? site.title + ' - ' + site.subtitle : site.title}"
  >
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 防止主题闪烁 - 在渲染前立即应用主题 -->
    <th:block th:replace="~{modules/theme-script :: head}" />
    <!-- 关键 CSS 内联 -->
    <th:block th:replace="~{modules/critical-css :: critical}" />

    <th:block
      th:replace="~{modules/seo-head :: meta(${documentTitle}, ${site.seo?.description ?: site.subtitle}, '/', ${site.logo}, 'website')}"
    />
    <!-- 字体 - 异步加载，不阻塞渲染 -->
    <th:block th:replace="~{modules/font-loader :: fonts}" />
    <th:block th:replace="~{modules/font-loader :: index-fonts}" />
    <!-- 主题样式 -->
    <link rel="stylesheet" th:href="@{/assets/css/main.css?v={version}(version=${theme.spec.version})}" />
    <link rel="stylesheet" th:href="@{/assets/css/index.css?v={version}(version=${theme.spec.version}, rev=1)}" />
    <!-- 以下样式仅在启用首页头部时加载 -->
    <th:block th:if="${theme.config.pages.index.background_settings?.enable_header != false}">
      <!-- 背景特效样式 - 只在选择 CSS 特效时加载 -->
      <link
        th:if="${theme.config.pages.index.background_settings.background_type == 'effect'}"
        rel="stylesheet"
        th:href="@{/assets/css/index-effects.css?v={version}(version=${theme.spec.version})}"
      />
      <!-- 天气联动特效样式 - 只在选择天气联动时加载 -->
      <link
        th:if="${theme.config.pages.index.background_settings.background_type == 'weather'}"
        rel="stylesheet"
        th:href="@{/assets/css/index-weather-effects.css?v={version}(version=${theme.spec.version})}"
      />
      <!-- 标题特效样式 - 只在显示标题时加载 -->
      <link
        th:if="${theme.config.pages.index.title_settings.show_title}"
        rel="stylesheet"
        th:href="@{/assets/css/index-title-effects.css?v={version}(version=${theme.spec.version})}"
      />
      <!-- 副标题特效样式 - 只在显示副标题时加载 -->
      <link
        th:if="${theme.config.pages.index.subtitle_settings.show_subtitle}"
        rel="stylesheet"
        th:href="@{/assets/css/index-subtitle-effects.css?v={version}(version=${theme.spec.version})}"
      />
    </th:block>


  </head>

  <body
    th:with="bgConfig = ${theme.config.visual.global_background},
                 enableCustomBg = ${bgConfig?.enable_custom == true},
                 bgStyle = ${bgConfig?.background_style ?: 'base-200'},
                 bgClass = ${enableCustomBg ? (bgStyle == 'grid' ? 'bg-base-100' : 'bg-' + bgStyle) : 'bg-base-200'}"
    th:class="'min-h-screen text-base-content relative ' + ${bgClass}"
  >

    <div class="relative z-10">
      <!-- 导航栏 -->
      <th:block th:replace="~{modules/nav :: navbar}" />

      <!-- Swup 替换时，Alpine 以此根节点清理首页组件。 -->
      <main
        id="swup" data-page="index"
        x-data
        th:class="${theme.config.pages.index.background_settings?.enable_header != false} ? 'flex-1 -mt-16' : 'flex-1'"
      >
        <h1
          th:if="${theme.config.pages.index.background_settings?.enable_header == false or theme.config.pages.index.title_settings?.show_title != true}"
          class="sr-only"
          th:text="${site.title}"
        ></h1>
        <!-- 首页头部区域 - 放入 swup 容器，保证与首页正文共享同一 页面生命周期 -->
        <th:block th:if="${theme.config.pages.index.background_settings?.enable_header != false}">
          <th:block th:replace="~{modules/index/header}" />
        </th:block>

        <th:block th:replace="~{modules/component-settings :: sidebar('index', ${content})}" />
      </main>

      <!-- 页脚 -->
      <th:block th:replace="~{modules/footer :: footer}" />
    </div>

    <div id="swup-page-extras">
      <th:block th:replace="~{modules/global-background :: grid(${enableCustomBg}, ${bgStyle})}" />
      <!-- 悬浮 Dock 控制栏 -->
      <th:block th:replace="~{modules/floating-dock :: dockWithConfig('index', 'basic')}" />
    </div>

    <!-- JavaScript 文件 -->

    <script type="module" th:src="@{/assets/js/main.js?v={version}(version=${theme.spec.version})}"></script>
  </body>
</html>
